<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Assessment — AI Literacy & Technical Assessment</title>
<style>
  :root{
    --navy:#0F2A4A; --blue:#0070AD; --gold:#C9A227; --light-blue:#EAF3FA;
    --grey:#3C3C3C; --light-grey:#F4F5F7; --green:#1E5B2F; --red-err:#8A1F1F; --warn:#B45309;
    --border:#D8DEE6;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#F6F8FA; color:var(--grey); }
  header{ background:var(--navy); color:#fff; padding:14px 26px; display:flex; align-items:center; justify-content:space-between; border-bottom:4px solid var(--gold); flex-wrap:wrap; gap:10px; }
  header h1{ margin:0; font-size:17px; }
  header .brand{ font-size:11px; letter-spacing:1.5px; color:var(--gold); font-weight:700; margin-bottom:3px;}
  .stats-strip{ display:flex; gap:10px; align-items:center; }
  .stat-pill{ background:#0A1E36; border:1.5px solid #2A4A6E; border-radius:10px; padding:6px 14px; text-align:center; min-width:90px; }
  .stat-pill .sv{ font-size:14px; font-weight:800; color:#fff; }
  .stat-pill .sl{ font-size:9px; letter-spacing:.5px; color:#9FB3C8; text-transform:uppercase; }
  main{ max-width:1360px; margin:0 auto; padding:18px 20px 60px; }
  footer.appfoot{ text-align:center; color:#8A94A0; font-size:11.5px; padding:18px 10px 30px; }
  button.btn{ background:var(--navy); color:#fff; border:none; padding:10px 20px; border-radius:7px; font-size:13.5px; font-weight:700; cursor:pointer; }
  button.btn.secondary{ background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button.btn.green{ background:var(--green); color:#fff; }
  button.btn:hover{ opacity:.9; }
  button.btn:disabled{ opacity:.4; cursor:not-allowed; }
  a.linklike{ color:var(--blue); font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:none; }
  a.linklike:hover{ text-decoration:underline; }

  /* ===================== INSTRUCTIONS SCREEN ===================== */
  .instr-wrap{ max-width:920px; margin:30px auto; }
  .instr-card{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:28px 32px; margin-bottom:18px; }
  .instr-card h2{ margin:0 0 14px; color:var(--navy); font-size:19px; }
  .instr-card ul{ margin:0; padding-left:20px; line-height:1.9; font-size:14px; }
  .instr-card ul li{ margin-bottom:4px; }
  .syscheck{ display:flex; gap:22px; flex-wrap:wrap; background:var(--light-grey); border-radius:10px; padding:14px 18px; margin-top:18px; }
  .syscheck .sc-item{ font-size:12.5px; color:#3C4652; display:flex; align-items:center; gap:6px; }
  .syscheck .sc-item .dot{ color:var(--green); font-weight:800; }
  .instr-start-row{ text-align:center; margin-top:6px; }
  .instr-start-row button{ font-size:15px; padding:13px 40px; }
  .instr-meta{ display:flex; gap:26px; flex-wrap:wrap; font-size:12.5px; color:#5A6472; margin-bottom:16px; }
  .instr-meta b{ color:var(--navy); }

  /* ===================== QUIZ SHELL ===================== */
  .quiz-shell{ display:flex; gap:20px; align-items:flex-start; }
  .sidebar{ width:250px; flex:0 0 250px; background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; position:sticky; top:16px; }
  .sidebar h3{ margin:0; padding:14px 16px; font-size:12px; letter-spacing:.6px; text-transform:uppercase; color:#8A94A0; border-bottom:1px solid var(--border); background:#FAFBFC; }
  .sb-section{ padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
  .sb-section:last-child{ border-bottom:none; }
  .sb-section.active{ background:var(--light-blue); border-left:4px solid var(--blue); padding-left:12px; }
  .sb-section .sb-name{ font-weight:700; font-size:13.5px; color:var(--navy); margin-bottom:5px; }
  .sb-section .sb-count{ font-size:12px; color:#5A6472; }
  .sb-progress-track{ height:5px; background:#E4E8EC; border-radius:3px; margin-top:8px; overflow:hidden; }
  .sb-progress-fill{ height:100%; background:var(--blue); border-radius:3px; }

  .quiz-main{ flex:1; min-width:0; }
  .sec-header{ background:#fff; border:1px solid var(--border); border-radius:10px 10px 0 0; padding:16px 22px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  .sec-header h2{ margin:0; font-size:17px; color:var(--navy); }
  .sec-header .sec-sub{ font-size:12.5px; color:#5A6472; font-weight:600; }
  .qa-body{ background:#fff; border:1px solid var(--border); border-top:none; padding:6px 22px 22px; }

  .scenario-block{ background:var(--light-blue); border:1px solid #CFE2F0; border-radius:8px; padding:14px 18px; margin:18px 0 6px; font-size:13.5px; line-height:1.65; color:#1D3A56; }
  .scenario-block .sc-tag{ font-weight:800; font-size:11px; letter-spacing:.5px; color:var(--blue); text-transform:uppercase; display:block; margin-bottom:6px; }

  .qblock{ border-top:1px solid #EDEFF2; padding:20px 0 18px; }
  .qblock:first-of-type{ border-top:none; }
  .qnum{ font-weight:800; color:var(--navy); font-size:14px; margin-bottom:6px; }
  .qtext{ font-size:14px; line-height:1.7; margin-bottom:12px; color:#20272F; }
  .qtext pre{ margin:10px 0; }
  .opslabel{ font-size:11.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:#8A94A0; margin-bottom:8px; }
  .opt-row{ display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border:1px solid #E4E8EC; border-radius:8px; margin-bottom:8px; cursor:pointer; transition:border-color .1s, background .1s; }
  .opt-row:hover{ border-color:var(--blue); background:#FAFCFE; }
  .opt-row.selected{ border-color:var(--blue); background:var(--light-blue); }
  .opt-row input[type=radio]{ margin-top:3px; flex:0 0 auto; }
  .opt-row .opt-letter{ font-weight:800; color:var(--navy); flex:0 0 auto; }
  .opt-row .opt-text{ font-size:13.5px; line-height:1.55; }
  .qblock .reset-row{ margin-top:2px; }

  .review-flag{ font-size:11px; font-weight:800; padding:2px 9px; border-radius:10px; }
  .review-flag.answered{ background:#EAF6EC; color:var(--green); }
  .review-flag.unanswered{ background:#FBF3E0; color:var(--warn); }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:12px; flex-wrap:wrap; }
  .pill-btn{ background:#fff; border:1.5px solid var(--navy); color:var(--navy); border-radius:22px; padding:10px 20px; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .pill-btn:hover{ background:var(--light-blue); }
  .pill-btn .pill-tag{ background:var(--navy); color:#fff; font-size:10px; font-weight:800; padding:2px 8px; border-radius:10px; letter-spacing:.4px; }
  .submit-bar{ margin-top:22px; }
  .submit-bar button{ width:100%; padding:16px; font-size:15.5px; border-radius:10px; }

  /* ===================== RESULTS SCREEN ===================== */
  .results-wrap{ max-width:1000px; margin:0 auto; }
  .score-card{ background:linear-gradient(135deg,#0F2A4A,#173F6B); color:#fff; border-radius:14px; padding:30px 34px; text-align:center; margin-bottom:22px; }
  .score-card .score-num{ font-size:44px; font-weight:800; }
  .score-card .score-label{ font-size:13px; color:#BFD3E6; text-transform:uppercase; letter-spacing:.6px; margin-top:4px; }
  .topic-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; margin-bottom:24px; }
  .topic-card{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .topic-card .tc-name{ font-weight:700; font-size:12.8px; color:var(--navy); margin-bottom:8px; min-height:32px; }
  .topic-card .tc-score{ font-size:13px; font-weight:800; }
  .topic-card .tc-score.good{ color:var(--green); }
  .topic-card .tc-score.bad{ color:var(--red-err); }
  .topic-card .tc-score.mid{ color:var(--warn); }
  .review-section-title{ font-size:15px; font-weight:800; color:var(--navy); margin:26px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--border); }
  .review-card{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:18px 22px; margin-bottom:14px; }
  .review-card .rc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .rc-topic-tag{ font-size:10.5px; font-weight:800; color:#5A6472; background:#EEF1F4; padding:2px 9px; border-radius:10px; text-transform:uppercase; letter-spacing:.4px; }
  .rc-verdict{ font-size:12px; font-weight:800; padding:3px 10px; border-radius:10px; }
  .rc-verdict.correct{ background:#EAF6EC; color:var(--green); }
  .rc-verdict.incorrect{ background:#FBEAEA; color:var(--red-err); }
  .rc-verdict.skipped{ background:#F4F5F7; color:#8A94A0; }
  .rc-option-line{ font-size:13px; margin:4px 0; padding:6px 10px; border-radius:6px; }
  .rc-option-line.is-correct{ background:#EAF6EC; color:#124A20; font-weight:700; }
  .rc-option-line.is-wrong-chosen{ background:#FBEAEA; color:#6E1616; font-weight:700; }
  .rc-explain{ margin-top:12px; background:#F7F8FA; border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.65; color:#2C333B; }
  .rc-explain b{ color:var(--navy); }
  .results-actions{ text-align:center; margin:26px 0 10px; }

  @media (max-width: 900px){
    .quiz-shell{ flex-direction:column; }
    .sidebar{ width:100%; flex:0 0 auto; position:static; }
  }
</style>
</head>

var SCRIPT_CLOSE = '<' + '/script>';
function real(s){ return (typeof s === 'string') ? s.split('@@SCRIPT_CLOSE@@').join(SCRIPT_CLOSE) : s; }

var QUESTIONS = [{"id": "q1", "section": 1, "topic": "AI Foundations & Generative AI", "scenario_group_id": null, "scenario": null, "question": "A team is building an internal tool that classifies incoming support tickets into one of six fixed categories. They are choosing between (a) calling a large, general-purpose foundation model with a prompt describing the categories, and (b) fine-tuning a much smaller open-weight model specifically on thousands of labelled historical tickets. Latency and per-request cost are both strict requirements for this feature. Which statement best explains why option (b), the smaller fine-tuned model, is likely the better engineering choice here?", "options": [{"id": "A", "text": "Foundation models are always more accurate than fine-tuned smaller models, regardless of how narrow or specific the task is, so option (a) is objectively better and the team should ignore latency concerns."}, {"id": "B", "text": "A smaller model fine-tuned on data representative of the exact task can match or exceed a much larger general-purpose foundation model's accuracy on that narrow, well-defined task, while being cheaper and faster to run, because it doesn't need to carry broad general-purpose capacity it will never use for this single job."}, {"id": "C", "text": "Fine-tuned models can never be updated or retrained once deployed, so they are unsuitable for any production system and should be avoided even if they are faster."}, {"id": "D", "text": "Foundation models are architecturally incapable of performing classification tasks and can only be used for open-ended text generation, so option (a) would not even work."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> For a narrow, well-scoped task like fixed-category ticket classification, a smaller model fine-tuned on representative labelled data typically reaches comparable or better accuracy than a much larger general-purpose model, while being significantly cheaper and faster per request &mdash; exactly what the latency/cost constraints call for. Model capability needed scales with task breadth, not the other way around.<br><br><b>Why the others are wrong:</b> (A) is a common misconception &mdash; \"bigger model = always more accurate\" ignores that narrow tasks don't benefit from a foundation model's broad general knowledge, and it also ignores the stated latency/cost constraint entirely. (C) is false: fine-tuned models can absolutely be retrained/updated as new labelled data arrives, just like any other model artifact. (D) is false: foundation models are commonly used for classification (e.g., via prompting or a classification head); they are not limited to open-ended generation."}, {"id": "q2", "section": 1, "topic": "AI Foundations & Generative AI", "scenario_group_id": null, "scenario": null, "question": "A colleague explains an LLM this way: \"It doesn't actually 'know' facts the way a database does &mdash; at its core, it's a model that predicts the most statistically likely next token given the preceding context, and what looks like 'knowledge' is really patterns compressed from its training data.\" Given this description, which of the following is a genuine, well-known limitation of LLMs, as opposed to a common misconception about them?", "options": [{"id": "A", "text": "Because LLMs \"just predict the next token,\" they are incapable of ever producing a grammatically correct sentence that did not appear in their training data."}, {"id": "B", "text": "Because LLMs generate whatever continuation is statistically most probable rather than checking claims against reality, they can produce fluent, confident-sounding text that is factually wrong (a \"hallucination\"), with no built-in mechanism to verify truth unless external grounding is provided."}, {"id": "C", "text": "Because LLMs predict one token at a time, they are physically unable to take more than a single sentence of prior context into account when generating a response."}, {"id": "D", "text": "Because LLMs are trained on large amounts of human-written text, they inherently reason about cause and effect in exactly the same way humans do."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> This is the well-documented \"hallucination\" limitation: next-token prediction optimizes for plausible, fluent continuations, not for truth. Without external grounding (retrieval, citations, tool use), an LLM has no innate way to distinguish a fact it was well-trained on from a plausible-sounding fabrication.<br><br><b>Why the others are wrong:</b> (A) is false &mdash; next-token prediction is exactly what allows LLMs to generate fluent, entirely novel sentences never seen in training; that's a capability, not a limitation. (C) is false &mdash; modern LLMs handle large context windows (thousands to hundreds of thousands of tokens), far beyond \"a single sentence.\" (D) is a misconception: statistical pattern learning from text is not the same as human causal reasoning, and LLMs are well documented to make reasoning errors that reveal they don't reason about cause and effect the way people do."}, {"id": "q3", "section": 1, "topic": "Prompt Engineering & AI Productivity", "scenario_group_id": "grp_copilot", "scenario": "A developer is using an AI pair-programming tool (similar to GitHub Copilot) inside their IDE. They type a function signature <code>def calculate_discount(price, customer_type):</code> followed by a one-line comment <code># apply 10% discount for premium customers, no discount otherwise</code>, then press Enter. The tool immediately suggests a complete function body as inline \"ghost text\" that the developer can accept with Tab.", "question": "Which factor most increases the odds that the AI tool's very first suggestion will match the developer's actual intent?", "options": [{"id": "A", "text": "Using a deliberately generic, meaningless variable name so the model isn't \"biased\" by naming conventions in its suggestion."}, {"id": "B", "text": "Providing a clear, specific comment describing the exact business logic (which customer types get a discount, and what discount), and keeping naming/style consistent with the surrounding codebase, since the tool conditions its suggestion on the nearby context it can see."}, {"id": "C", "text": "Disabling type hints entirely, since AI code-completion tools are documented to work correctly only with fully untyped Python."}, {"id": "D", "text": "Writing the full function body first and letting the tool guess an appropriate docstring afterward, since docstrings are known to confuse completion models and reduce suggestion quality."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> AI code-completion tools generate suggestions conditioned on the visible context: function signature, comments, surrounding code style, and naming conventions. A precise comment stating the exact business rule (which customer type, what percentage) gives the model the clearest possible signal about intent, which is the single biggest lever a developer controls over suggestion quality.<br><br><b>Why the others are wrong:</b> (A) is backwards — meaningful names are additional context that helps the model, not noise to avoid. (C) is a fabricated claim; these tools work across typed and untyped code in many languages. (D) is also fabricated — docstrings/comments generally improve suggestion relevance rather than confusing the model."}, {"id": "q4", "section": 1, "topic": "Prompt Engineering & AI Productivity", "scenario_group_id": "grp_copilot", "scenario": "A developer is using an AI pair-programming tool (similar to GitHub Copilot) inside their IDE. They type a function signature <code>def calculate_discount(price, customer_type):</code> followed by a one-line comment <code># apply 10% discount for premium customers, no discount otherwise</code>, then press Enter. The tool immediately suggests a complete function body as inline \"ghost text\" that the developer can accept with Tab.", "question": "The developer accepts the suggested function body. Testing later reveals it doesn't handle a <code>customer_type</code> value of <code>None</code> gracefully (it throws an unhandled error). What is the most effective and appropriate response, reflecting good AI-assisted development practice?", "options": [{"id": "A", "text": "Trust the AI-generated code as correct by default going forward, since it was trained on a very large amount of real-world code and is therefore statistically likely to be right in general."}, {"id": "B", "text": "Treat the AI suggestion as a first draft: manually review the logic and test it against edge cases (like <code>None</code>, empty strings, or unexpected types) before merging, since AI-generated code is a starting point that still requires human verification, not a pre-verified solution."}, {"id": "C", "text": "Ask the AI to generate unit tests for the function and skip reviewing the function's own logic, since the generated tests will automatically catch every possible bug."}, {"id": "D", "text": "Regenerate the suggestion repeatedly until a visually different version appears, on the assumption that random variation across attempts increases the odds of correctness."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> The core discipline of AI-assisted development is treating generated code as an accelerant, not a substitute, for engineering judgement: review it, test edge cases explicitly, and only then merge. This is exactly how the missing <code>None</code> handling would be caught.<br><br><b>Why the others are wrong:</b> (A) is the exact anti-pattern that causes bugs like this one to reach production. (C) is flawed because AI-generated tests can just as easily miss the same edge cases the AI-generated implementation missed (or even encode the same wrong assumption), so they don't substitute for reviewing the implementation itself. (D) has no engineering basis; regenerating randomly doesn't reliably converge on correctness and skips the actual work of reviewing and testing."}, {"id": "q5", "section": 1, "topic": "Prompt Engineering & AI Productivity", "scenario_group_id": null, "scenario": null, "question": "Two prompts are sent to an LLM to summarize the same 20-page contract:<br><br><b>Prompt 1:</b> <code>\"Summarize this.\"</code><br><b>Prompt 2:</b> <code>\"You are a contracts paralegal. Summarize the attached contract in under 150 words, focusing specifically on payment terms, termination clauses, and liability caps. Use plain business English, no legal jargon.\"</code><br><br>Why does Prompt 2 reliably produce a more useful, consistent output across repeated runs?", "options": [{"id": "A", "text": "It is simply longer, and LLMs always produce better output for longer prompts regardless of what additional content is added."}, {"id": "B", "text": "It sets a role, explicit scope and length constraints, and specific focus areas, which sharply reduces ambiguity about what \"summarize\" should mean and what counts as relevant, leaving the model far less to guess about the task."}, {"id": "C", "text": "It repeats the underlying idea of \"summarize\" implicitly, and this repetition of intent is what reinforces the instruction and improves output quality."}, {"id": "D", "text": "It uses more technically formal vocabulary, and LLMs are specifically fine-tuned to respond better to formal register regardless of instructional content."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Good prompt engineering reduces ambiguity: defining a role, explicit output constraints (length, focus areas, tone) narrows the space of \"acceptable\" outputs and makes runs more consistent and directly usable, versus a vague instruction the model must interpret from scratch each time.<br><br><b>Why the others are wrong:</b> (A) is a misconception — prompt length alone doesn't determine quality; irrelevant length can even dilute the instruction. (C) misreads what's happening in Prompt 2; there's no meaningful repetition of \"summarize\" driving the improvement, it's the added specificity. (D) is fabricated; there's no such formal-register-preference training effect that would explain this gap, and Prompt 2's improvement comes from its structure/constraints, not its vocabulary register."}, {"id": "q6", "section": 1, "topic": "Advanced AI Systems", "scenario_group_id": "grp_rag", "scenario": "A company builds an internal support chatbot for its own product documentation. Instead of fine-tuning an LLM on that documentation, they split the docs into chunks, embed them into a vector database, and at query time retrieve the top-matching chunks for the user's question and insert them directly into the prompt before the LLM generates its final answer.", "question": "What is this architecture called, and what is its main benefit over relying purely on the LLM's own internal (parametric) knowledge?", "options": [{"id": "A", "text": "This is fine-tuning; its main benefit is faster inference, since no additional context is being added to the prompt at query time."}, {"id": "B", "text": "This is Retrieval-Augmented Generation (RAG); its main benefit is grounding responses in the company's current, verifiable documentation without retraining the model, which reduces hallucination on domain-specific facts the model was never trained on."}, {"id": "C", "text": "This is prompt chaining; its main benefit is that it removes the need for a vector database entirely by chaining several smaller prompts together."}, {"id": "D", "text": "This is agentic AI; its main benefit is that the LLM can now autonomously take real-world actions such as sending emails on the company's behalf."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Retrieving relevant chunks and inserting them into the prompt at query time is the textbook definition of RAG. Its key advantage is that the model's answer can be grounded in the company's actual, current documentation rather than only whatever it happened to memorize during training — with no retraining required whenever the docs change.<br><br><b>Why the others are wrong:</b> (A) misidentifies the technique entirely (no model weights are being updated here, so it isn't fine-tuning) and inserting extra context typically adds latency, not removes it. (C) confuses RAG with a different technique (prompt chaining), and RAG explicitly relies on a vector database rather than eliminating one. (D) is unrelated — nothing in the scenario describes the system taking autonomous actions; it only retrieves and answers."}, {"id": "q7", "section": 1, "topic": "Advanced AI Systems", "scenario_group_id": "grp_rag", "scenario": "A company builds an internal support chatbot for its own product documentation. Instead of fine-tuning an LLM on that documentation, they split the docs into chunks, embed them into a vector database, and at query time retrieve the top-matching chunks for the user's question and insert them directly into the prompt before the LLM generates its final answer.", "question": "The team later notices the chatbot sometimes gives a wrong answer even though logs confirm the correct documentation chunk WAS retrieved and included in the prompt context. Which of these is the most likely underlying cause?", "options": [{"id": "A", "text": "The vector database must be corrupted and needs to be rebuilt entirely from scratch before the chatbot can be trusted again."}, {"id": "B", "text": "The LLM can still misinterpret, partially ignore, or blend the retrieved context with its own prior (parametric) knowledge when generating the final answer, or the retrieved chunk may lack enough surrounding context to be understood correctly on its own — correct retrieval does not, by itself, guarantee correct generation."}, {"id": "C", "text": "RAG systems are physically limited to using exactly one retrieved chunk at a time, so the wrong answer must be coming from a completely different, unretrieved chunk."}, {"id": "D", "text": "This proves RAG fundamentally doesn't work for this use case and the team should switch to fine-tuning the model on their entire documentation set instead."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> RAG improves the odds of a correct answer by supplying relevant grounding, but the generation step is still performed by an LLM that can misread, only partially use, or override retrieved context with its own prior beliefs; a chunk taken out of its surrounding context can also be ambiguous on its own. Retrieval quality and generation faithfulness are two separate failure points.<br><br><b>Why the others are wrong:</b> (A) jumps to a drastic, unsupported conclusion; a single wrong answer with correctly retrieved context doesn't indicate database corruption. (C) is a fabricated technical limitation; RAG systems commonly retrieve and use multiple chunks. (D) overreacts to one failure mode; fine-tuning has its own costs and doesn't inherently solve generation-faithfulness issues either, and one anecdote doesn't establish RAG \"doesn't work.\""}, {"id": "q8", "section": 1, "topic": "Advanced AI Systems", "scenario_group_id": null, "scenario": null, "question": "An \"AI agent\" is given the instruction: \"Book the cheapest available flight from Delhi to Bengaluru for next Friday, then email the itinerary to my manager.\" Without further human input at each step, it searches flight listings, compares prices, selects the cheapest option, drafts an email with the itinerary, and sends it. Which statement best distinguishes this from a simple single-turn LLM prompt/response interaction?", "options": [{"id": "A", "text": "Nothing meaningfully distinguishes them; any LLM call that produces text output can accurately be labelled \"agentic.\""}, {"id": "B", "text": "The agent autonomously plans and executes a sequence of steps, calls external tools/APIs (a flight search service, an email service) to take actions in the real world, and uses the outcome of one step to decide the next — rather than just generating a single text response to a single prompt."}, {"id": "C", "text": "It is \"agentic\" purely because it happens to use a larger and more expensive underlying model than a typical chat interaction."}, {"id": "D", "text": "The defining feature of agentic AI is that it never needs any decision-making step, because it strictly follows one fixed, hard-coded script from start to finish."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Agentic AI is defined by autonomous multi-step planning and tool/API use, where the system decides what to do next based on intermediate results (e.g., which flight was actually cheapest), rather than producing one static response. That's what separates the flight-booking example from a regular chat completion.<br><br><b>Why the others are wrong:</b> (A) erases a real and useful distinction; a single text response with no tool use or multi-step planning is not what practitioners mean by \"agentic.\" (C) is false — model size is unrelated to whether a system exhibits agentic behavior; a small model orchestrating tool calls can still be agentic. (D) is self-contradictory with the premise — the scenario explicitly involves the agent deciding which flight is cheapest, which is a decision step, not a fixed script."}, {"id": "q9", "section": 1, "topic": "Responsible AI & AI Evaluation", "scenario_group_id": null, "scenario": null, "question": "An HR team uses an LLM to screen resumes and generate a numeric \"fit score\" for each candidate. An internal audit finds that candidates with employment gaps (which, in the applicant pool, correlate strongly with caregiving responsibilities) consistently receive lower fit scores even when their listed skills fully match the job requirements. What is the most accurate description of this issue, and the correct next step?", "options": [{"id": "A", "text": "This is expected and entirely acceptable, because employment gaps are an objectively negative signal in any hiring process and the model is correctly reflecting that."}, {"id": "B", "text": "This is most likely a bias the model learned from patterns in its training/scoring data (associating gaps with weaker candidates); responsible practice requires auditing model outputs for this kind of disparate impact, correcting or removing the biased signal, and keeping a human reviewer in the loop rather than deploying the score unchecked."}, {"id": "C", "text": "LLMs cannot exhibit bias because they only process text statistically, so the score gap must be caused by an unrelated bug in how the final numeric score is calculated, not the model itself."}, {"id": "D", "text": "The correct fix is to stop giving the model any resume text at all, since providing no input is the only way to fully eliminate bias from the system."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Systematic score differences correlated with a protected/sensitive pattern (like caregiving-related gaps) despite matching skills is a textbook sign of learned bias. Responsible AI practice means actively auditing for disparate impact, correcting the scoring signal, and retaining meaningful human oversight before such scores drive real hiring decisions.<br><br><b>Why the others are wrong:</b> (A) normalizes a biased outcome as if it were self-evidently correct, which is exactly the failure mode responsible AI practices exist to catch. (C) is a common but false belief — models absolutely can encode and reproduce bias present in their training/scoring data, purely through statistical pattern-matching; \"statistical\" does not mean \"unbiased.\" (D) is an unworkable, extreme non-solution — giving the model no input makes it useless for the task rather than fixing the underlying bias, and doesn't reflect real mitigation practice (auditing, rebalancing, human review)."}, {"id": "q10", "section": 1, "topic": "Responsible AI & AI Evaluation", "scenario_group_id": null, "scenario": null, "question": "A junior analyst asks an LLM to write a short market research summary \"with sources.\" The model returns a polished paragraph that cites a specific statistic from a \"McKinsey 2023 report,\" complete with a plausible-sounding title. The analyst searches extensively but cannot find any such report anywhere. What does this best illustrate, and what is the correct practice going forward?", "options": [{"id": "A", "text": "The LLM must secretly have access to private, paywalled reports, and the analyst simply didn't search hard enough to find it."}, {"id": "B", "text": "This is a classic hallucination: the model generated a plausible-sounding but fabricated citation because it is optimizing for fluent, convincing text rather than verified fact; every AI-generated factual claim and citation must be independently verified before being used or shared."}, {"id": "C", "text": "This proves the model must have been trained on data from after 2023 and simply mislabeled the year of the report by mistake."}, {"id": "D", "text": "Citations produced by LLMs are always completely fabricated with no exceptions, so any prompt requesting citations should never be used under any circumstances."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Fabricated but plausible-looking citations (\"citation hallucination\") are a widely documented failure mode, because the model is generating text that statistically resembles a real citation, not retrieving or verifying an actual source. The correct workflow is to treat AI-generated citations and factual claims as unverified until independently checked.<br><br><b>Why the others are wrong:</b> (A) invents a capability (secret access to paywalled data) with no basis, and ignores the much simpler, well-known explanation (hallucination). (C) is a non-sequitur; a training cutoff date has nothing to do with why a citation would be fabricated. (D) overgeneralizes into an unhelpful absolute — LLMs can sometimes cite real sources correctly, especially when grounded via retrieval, but the output still always needs verification rather than being banned outright."}, {"id": "q11", "section": 2, "topic": "Programming Logic & Problem Solving", "scenario_group_id": "grp_dup", "scenario": "The following pseudocode is meant to scan an array left to right and return the very first value that turns out to be a repeat of an earlier value, or <code>-1</code> if no value repeats:<br><br><pre style=\"background:#1E2530;color:#D8E2EC;border-radius:6px;padding:10px 14px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre;\">function findDuplicate(arr):\n    seen = {}\n    for i = 0 to length(arr) - 1:\n        if arr[i] in seen:\n            return arr[i]\n        seen[arr[i]] = true\n    return -1</pre>", "question": "For the input array <code>[4, 2, 7, 2, 4]</code>, what does this pseudocode return, and why?", "options": [{"id": "A", "text": "4, because 4 is the first value that appears in the array at all, so it takes priority over any later repeated value."}, {"id": "B", "text": "2, because scanning left to right, the value 2 (already recorded in <code>seen</code> from index 1) is encountered again at index 3, before the repeat of 4 is reached at index 4 — making 2 the first repeat found, even though 4 also repeats later."}, {"id": "C", "text": "-1, because this function only detects duplicates that sit in directly adjacent array positions."}, {"id": "D", "text": "7, because 7 has no duplicate anywhere in the array, so it is returned as a sentinel \"no duplicate found\" value."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Tracing execution: i=0 (4 not in seen, add 4), i=1 (2 not in seen, add 2), i=2 (7 not in seen, add 7), i=3 (2 IS in seen → return 2 immediately). The loop returns as soon as it finds the first repeat while scanning left to right, which is 2 at index 3 — it never even reaches index 4 where 4 repeats.<br><br><b>Why the others are wrong:</b> (A) confuses \"appears first\" with \"is detected as a repeat first\" — 4 appears first but its repeat is detected later than 2's repeat. (C) is false; the function uses a hash-map membership check (<code>seen</code>), which detects a repeat anywhere earlier in the array, not just in an adjacent position. (D) misreads the code; 7 has no duplicate and therefore is never what's returned by this early-return logic — it would only be relevant if the function returned -1, which it doesn't for this input."}, {"id": "q12", "section": 2, "topic": "Programming Logic & Problem Solving", "scenario_group_id": "grp_dup", "scenario": "The following pseudocode is meant to scan an array left to right and return the very first value that turns out to be a repeat of an earlier value, or <code>-1</code> if no value repeats:<br><br><pre style=\"background:#1E2530;color:#D8E2EC;border-radius:6px;padding:10px 14px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre;\">function findDuplicate(arr):\n    seen = {}\n    for i = 0 to length(arr) - 1:\n        if arr[i] in seen:\n            return arr[i]\n        seen[arr[i]] = true\n    return -1</pre>", "question": "Suppose a developer \"optimizes\" the check by changing <code>if arr[i] in seen</code> to <code>if seen[arr[i]] == true</code>, without pre-initializing every possible key, in a language where directly indexing a hashmap with a key that was never set throws a runtime error (instead of evaluating to a falsy value). What is the most accurate consequence for the input <code>[1, 2, 3]</code>?", "options": [{"id": "A", "text": "No change in behavior at all; the function still correctly returns -1 after scanning the whole array."}, {"id": "B", "text": "The function will throw a runtime error the very first time it checks a value not yet present in <code>seen</code> (e.g., at i=0, evaluating <code>seen[1]</code> while <code>seen</code> is still empty), because directly indexing a hashmap with a missing key raises an error in this language rather than returning a falsy value the way a membership check (\"in\") does."}, {"id": "C", "text": "The function will silently enter an infinite loop instead of ever returning a value."}, {"id": "D", "text": "The function will run measurably faster than before, because direct key indexing always avoids the overhead that a membership check like \"in\" incurs."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> A membership test (<code>in</code>) and direct indexing are not equivalent when a key is absent: <code>in</code> safely returns false, but indexing an absent key throws in a strict language. Since <code>seen</code> starts empty, the very first lookup at i=0 (checking <code>seen[1]</code>) would hit a nonexistent key and crash before the array is ever fully scanned.<br><br><b>Why the others are wrong:</b> (A) ignores that the change alters the failure mode entirely — it would crash long before reaching a -1 return. (C) has no basis; the failure here is a thrown error, not a loop condition issue, so there's no reason to expect an infinite loop. (D) is a common but false assumption — in this language, indexing a missing key isn't a lightweight optimization over membership testing, it's an error condition, so \"faster\" doesn't even apply once it crashes."}, {"id": "q13", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "A developer has a collection of one million unique integers and needs to repeatedly check whether a given number exists in that collection, many thousands of times over the life of the program (the collection itself doesn't change after being built). Which approach gives the best average-case time complexity per lookup, and why?", "options": [{"id": "A", "text": "Keep the numbers in an unsorted array and run a linear scan for every lookup: O(n) per lookup, which is the fastest possible approach because it requires no preprocessing step."}, {"id": "B", "text": "Sort the array once up front (O(n log n)) and then run binary search for every lookup: O(log n) per lookup, which is the best achievable average-case complexity for repeated lookups."}, {"id": "C", "text": "Insert every element into a hash set once (O(n) total build cost), after which each lookup is O(1) on average, since hashing avoids both the linear scan of an unsorted array and the log-n comparisons of binary search."}, {"id": "D", "text": "Convert the collection into a linked list, since linked lists provide faster element lookup than arrays in every case."}], "correct_option_id": "C", "explanation": "<b>Correct: C.</b> For a static collection queried repeatedly, building a hash set once (O(n)) and then getting O(1) average-case lookups thereafter beats both a linear scan (O(n) every single lookup) and binary search (O(log n) every lookup) in the long run, since thousands of lookups amortize the one-time build cost.<br><br><b>Why the others are wrong:</b> (A) is far from \"fastest\" — O(n) per lookup across thousands of lookups is by far the slowest option here; \"no preprocessing\" doesn't make it faster overall. (B) is a genuinely reasonable approach but is not the BEST average case — O(log n) per lookup is worse than the O(1) average lookup a hash set provides. (D) is false; linked lists have O(n) lookup, worse than both arrays with binary search and hash sets — they are not \"faster in every case.\""}, {"id": "q14", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "You need to determine whether any two numbers in an array of up to 100,000 elements sum to a target value K. Which of the following statements about possible approaches is MOST accurate?", "options": [{"id": "A", "text": "Only a brute-force nested loop checking every pair (O(n²)) is guaranteed to give a correct answer; any approach that avoids checking every possible pair is unreliable."}, {"id": "B", "text": "Sorting the array and then using two pointers moving inward from both ends (O(n log n) overall) is the single fastest possible correct approach, and no approach can do better."}, {"id": "C", "text": "Using a single pass with a hash set — for each number x, check whether (K − x) is already in the set, otherwise add x to the set — is correct and needs only O(n) time and O(n) extra space, in a single left-to-right pass."}, {"id": "D", "text": "Both the sort-and-two-pointer approach (O(n log n)) and the single-pass hash-set approach (O(n)) are valid, correct, and each meaningfully better than brute force; the hash-set approach typically has the better time complexity of the two, at the cost of using more extra memory."}], "correct_option_id": "D", "explanation": "<b>Correct: D.</b> This is the nuanced, fully accurate statement: the sort + two-pointer method is O(n log n) time with O(1) extra space (or O(n) if sorting isn't in-place), and is correct; the hash-set method is O(n) time but O(n) extra space, and is also correct. Both comfortably beat brute-force O(n²), and between the two, the hash-set approach has the better asymptotic time complexity, trading additional memory for that speed.<br><br><b>Why the others are wrong:</b> (A) is false — both alternative approaches described are provably correct, not just brute force. (B) is false because it ignores the hash-set approach, which is faster in time complexity (O(n) vs O(n log n)), so two-pointer is not \"the fastest possible.\" (C) is true on its own but is not the MOST accurate/complete answer among the options, since it omits the equally valid two-pointer approach and the comparison between the two — which (D) captures fully."}, {"id": "q15", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "A recursive function computes <code>fibonacci(n)</code> using the naive definition <code>fibonacci(n) = fibonacci(n-1) + fibonacci(n-2)</code>, with two recursive calls at every step and no memoization/caching of previously computed results. What are the time complexity and space complexity of this naive approach, respectively?", "options": [{"id": "A", "text": "Time O(n), Space O(n) — recursion depth always determines both time and space equally."}, {"id": "B", "text": "Time O(2ⁿ), Space O(n) — the call tree branches exponentially, giving exponential total work, but the maximum recursion depth on the call stack at any single moment is only proportional to n, since deeper branches are fully resolved and popped off the stack before sibling branches are explored."}, {"id": "C", "text": "Time O(2ⁿ), Space O(2ⁿ) — since there are exponentially many total function calls made over the life of the computation, all of them must exist in memory simultaneously."}, {"id": "D", "text": "Time O(n²), Space O(1) — the two recursive calls at each level behave equivalently to two nested loops, and recursion itself uses no stack memory."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> The naive recursive Fibonacci makes roughly 2ⁿ total calls (exponential time), but space complexity is governed by the maximum depth of the call stack at any one time — not by the total number of calls ever made across the whole execution. Since recursive calls resolve and pop off the stack (depth-first) before siblings are explored, the deepest the stack ever gets is O(n).<br><br><b>Why the others are wrong:</b> (A) understates the time complexity — it is not linear, it's exponential, due to massively redundant recomputation of the same subproblems. (C) is the classic misconception this question targets: confusing \"total calls made over time\" with \"calls that must be in memory at the same time\" — the call stack doesn't retain every call that has already returned. (D) is wrong on both counts: the time is exponential, not quadratic, and recursion inherently uses stack memory (proportional to depth), so space is not O(1)."}, {"id": "q16", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "A codebase defines a base class <code>Shape</code> with a method <code>calculateArea()</code>, and subclasses <code>Circle</code> and <code>Square</code> each override it with their own formula. Elsewhere in the code:<br><br><pre style=\"background:#1E2530;color:#D8E2EC;border-radius:6px;padding:10px 14px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre;\">totalArea = 0\nfor shape in shapes:   // a mixed list of Circle and Square objects\n    totalArea += shape.calculateArea()</pre>This loop correctly computes the right area for each shape without ever checking what specific type each shape is. Which OOP principle is being demonstrated here?", "options": [{"id": "A", "text": "Encapsulation — because each shape class hides its internal data fields from other classes in the codebase."}, {"id": "B", "text": "Polymorphism — because the same method call, <code>calculateArea()</code>, automatically invokes the correct overridden implementation based on each object's actual runtime type, without the calling code needing to know or check which subclass it's dealing with."}, {"id": "C", "text": "Inheritance — because Circle and Square inherit from Shape, and inheritance by itself is what guarantees the correct area formula is used for each object."}, {"id": "D", "text": "Abstraction — because the base Shape class hides the specific mathematical formula used to calculate area from the rest of the program."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> This is the defining example of polymorphism: identical calling code (<code>shape.calculateArea()</code>) produces behavior appropriate to each object's actual runtime type. The loop never branches on type, yet gets the right formula every time — that's runtime method dispatch, i.e., polymorphism.<br><br><b>Why the others are wrong:</b> (A) describes a different principle (hiding internal data/state), which isn't what's being shown — the example is about method behavior selection, not data hiding. (C) is a very common near-miss: inheritance alone (subclasses existing) doesn't guarantee correct dispatch by itself — it's specifically the ability to override and have the right override selected at runtime (polymorphism) that makes the loop work; inheritance is a prerequisite, not the mechanism demonstrated. (D) also describes a different principle (simplifying/hiding complexity behind an interface); the loop's correctness comes from dynamic dispatch, not from formulas being hidden."}, {"id": "q17", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "Consider this SQL query:<br><br><pre style=\"background:#1E2530;color:#D8E2EC;border-radius:6px;padding:10px 14px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre;\">SELECT customers.name, COUNT(orders.id) AS order_count\nFROM customers\nLEFT JOIN orders ON customers.id = orders.customer_id\nGROUP BY customers.name\nHAVING COUNT(orders.id) = 0;</pre>What does this query return?", "options": [{"id": "A", "text": "All customers along with how many orders each one has placed, sorted from fewest to most orders."}, {"id": "B", "text": "Only customers who have never placed an order, because the LEFT JOIN keeps every customer row even when there's no matching order (producing NULLs for the order columns), and the HAVING clause then filters the grouped results down to just those groups whose order count is zero."}, {"id": "C", "text": "This query throws an error, because HAVING can never be used together with COUNT() unless a WHERE clause is also present in the same query."}, {"id": "D", "text": "Only orders that have no associated customer record, as a direct result of the LEFT JOIN's direction."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> LEFT JOIN preserves every row from <code>customers</code> even when there's no matching row in <code>orders</code> (those columns come back NULL, and <code>COUNT(orders.id)</code> counts 0 for such a customer). Grouping by customer and then filtering with <code>HAVING COUNT(orders.id) = 0</code> keeps exactly the customers whose order count is zero — i.e., customers with no orders at all.<br><br><b>Why the others are wrong:</b> (A) describes what the query would do WITHOUT the HAVING clause filtering it down, and there's also no ORDER BY here so nothing guarantees sorting by count. (C) is false — HAVING filtering on an aggregate like COUNT() is standard SQL and does not require a WHERE clause to be present. (D) has the join direction's implication backwards; LEFT JOIN keeps unmatched rows from the LEFT table (customers), not orphaned rows from the right table (orders)."}, {"id": "q18", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "An API endpoint <code>/orders/42</code> supports GET, PUT, PATCH, and DELETE. A client wants to update ONLY the <code>status</code> field of order 42 (from \"pending\" to \"shipped\") without resending every other field of the order. Which HTTP method is most appropriate here, and why?", "options": [{"id": "A", "text": "PUT, because PUT is the correct method for any kind of update to a resource, regardless of whether the full resource representation is sent or only a subset of fields."}, {"id": "B", "text": "PATCH, because it is specifically designed for partial updates to a resource, whereas PUT is conventionally expected to replace the entire resource with exactly what's provided in the request (meaning fields left out of a PUT request may be reset/cleared rather than left untouched)."}, {"id": "C", "text": "POST, because POST is the only HTTP method in REST that is capable of modifying data that already exists on the server."}, {"id": "D", "text": "GET, since modern REST API conventions allow GET requests to include a request body carrying the update data."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> PATCH exists precisely for partial updates: sending just the changed field(s). PUT's REST convention is full-resource replacement — using PUT with only <code>status</code> risks other fields being wiped/reset depending on server implementation, which is exactly the ambiguity PATCH avoids here.<br><br><b>Why the others are wrong:</b> (A) misstates PUT's semantics; PUT's conventional contract is \"replace the whole resource,\" which is precisely why it's the wrong choice for a partial field update. (C) is false; PUT, PATCH, and DELETE are all standard REST methods that modify existing server data, and POST is conventionally for creating new resources (though it's occasionally reused for actions, it's not \"the only\" method capable of modification). (D) is false; GET is conventionally defined as a safe, read-only method and is not the mechanism for sending update payloads in REST APIs."}, {"id": "q19", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "A mobile app embeds a static, long-lived API key directly inside its client-side code to authenticate requests to a backend service. A security review flags this practice as risky. What is the most accurate reason this is a genuine security concern, and what is the better practice?", "options": [{"id": "A", "text": "It isn't actually a concern; API keys are designed to be public information, similar to a username, so embedding one in client code is standard and safe practice."}, {"id": "B", "text": "Anything shipped inside client-side code (the compiled app binary) can be extracted or decompiled by anyone who downloads the app, so a static embedded key is effectively public and can be abused (e.g., for unauthorized usage or unexpected billing); the better practice is for the backend to issue short-lived, narrowly-scoped tokens after properly authenticating the user, instead of shipping a long-lived secret inside the client."}, {"id": "C", "text": "The only real concern is that the key might eventually expire, so the correct fix is to use a key configured to never expire."}, {"id": "D", "text": "This is exclusively an Android-specific concern, since Android apps are open-source by default, whereas iOS apps are fully immune to this kind of extraction."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Client-side code, including mobile app binaries, is fundamentally reachable and reverse-engineerable by the end user (and anyone else who obtains the app). A long-lived embedded secret is therefore not truly secret. The standard mitigation is server-issued, short-lived, scoped tokens tied to an authenticated session, minimizing the blast radius if one leaks.<br><br><b>Why the others are wrong:</b> (A) confuses \"API keys can identify a client\" with \"API keys are safe to expose,\" which is not true for keys meant to gate access/billing. (C) misidentifies the core problem as expiry rather than exposure/extractability — a non-expiring key embedded in client code is actually worse, since it never becomes invalid even after being extracted. (D) is false; both Android and iOS app binaries can be decompiled/inspected by a determined attacker, so this is a platform-independent concern, not an Android-only one."}, {"id": "q20", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "A team currently deploys their application by manually installing dependencies on a virtual machine, and deployments frequently break with \"it works on my machine but not in production,\" caused by differing library versions and OS packages between environments. They are evaluating containerizing the app with Docker as part of adopting a CI/CD pipeline. What is the most accurate benefit Docker specifically provides for this problem?", "options": [{"id": "A", "text": "Docker automatically analyzes and rewrites the application's source code to fix bugs, which is what eliminates \"works on my machine\" issues entirely."}, {"id": "B", "text": "Docker packages the application together with its exact dependencies, libraries, and runtime environment into a single portable image, so the same container runs consistently across development, CI, and production — largely eliminating environment-mismatch issues, though it doesn't by itself replace good CI/CD practices, testing, or configuration management."}, {"id": "C", "text": "Docker replaces the need for version control entirely, since container images already track every historical code change made to the application."}, {"id": "D", "text": "Docker is itself a cloud hosting provider, so containerizing an app with Docker automatically deploys it to a cloud data center with no further configuration needed."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Docker's core value proposition is environment consistency: the image bundles the app with its exact dependency versions and OS-level packages, so \"works on my machine\" issues caused by environment drift are largely eliminated — the same image runs the same way everywhere. It is a packaging/runtime tool, not a replacement for testing or CI/CD discipline.<br><br><b>Why the others are wrong:</b> (A) is a fabricated capability; Docker has no code-fixing intelligence, it only packages what it's given. (C) confuses containerization with version control; Docker images capture a snapshot of a built environment, not a commit history of source code changes — Git (or similar) is still needed for that. (D) misidentifies what Docker is; Docker is a containerization technology, not a cloud provider, and using it does not by itself deploy anything anywhere without separate infrastructure/hosting setup."}];
var SECTIONS = [{"num": 1, "name": "AI Literacy", "short": "ai_literacy"}, {"num": 2, "name": "Technical Assessment", "short": "technical"}];
var ALL_TOPICS = ["AI Foundations & Generative AI", "Prompt Engineering & AI Productivity", "Advanced AI Systems", "Responsible AI & AI Evaluation", "Programming Logic & Problem Solving", "Data Structures & Algorithms", "Software Engineering Fundamentals", "Modern Engineering Awareness"];

var STORAGE_KEY = 'aiLiteracyTechPractice:v1';

function questionsFor(sectionNum){
  return QUESTIONS.filter(function(q){ return q.section === sectionNum; });
}
function totalQuestions(){ return QUESTIONS.length; }

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
var state = {
  view: 'instructions',   // 'instructions' | 'quiz' | 'results'
  currentSection: 1,
  answers: {},            // { qid: optionId }
  submitted: false
};

function safeLoad(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object'){
      state.view = parsed.view || 'instructions';
      state.currentSection = parsed.currentSection || 1;
      state.answers = parsed.answers || {};
      state.submitted = !!parsed.submitted;
    }
  }catch(e){ /* ignore corrupt/blocked storage */ }
}
function safeSave(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      view: state.view,
      currentSection: state.currentSection,
      answers: state.answers,
      submitted: state.submitted
    }));
  }catch(e){ /* ignore quota/privacy errors */ }
}

/* ============================================================
   SCORING HELPERS
   ============================================================ */
function isAnswered(qid){ return Object.prototype.hasOwnProperty.call(state.answers, qid); }
function attemptedCountForSection(sectionNum){
  var qs = questionsFor(sectionNum);
  var n = 0;
  qs.forEach(function(q){ if(isAnswered(q.id)) n++; });
  return n;
}
function totalAttempted(){
  var n = 0;
  QUESTIONS.forEach(function(q){ if(isAnswered(q.id)) n++; });
  return n;
}
function computeScore(){
  var correct = 0;
  QUESTIONS.forEach(function(q){
    if(state.answers[q.id] === q.correct_option_id) correct++;
  });
  return correct;
}
function computeTopicBreakdown(){
  var map = {};
  ALL_TOPICS.forEach(function(t){ map[t] = { correct: 0, total: 0 }; });
  QUESTIONS.forEach(function(q){
    map[q.topic].total++;
    if(state.answers[q.id] === q.correct_option_id) map[q.topic].correct++;
  });
  return map;
}

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(s){
  return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
}
function optionLetterText(q, id){
  for(var i=0;i<q.options.length;i++){ if(q.options[i].id === id) return q.options[i].text; }
  return '';
}

/* ============================================================
   RENDER: TOP-LEVEL
   ============================================================ */
function renderApp(){
  safeSave();
  var root = document.getElementById('appRoot');
  if(state.view === 'instructions'){
    root.innerHTML = renderInstructionsHtml();
    wireInstructions();
  } else if(state.view === 'quiz'){
    root.innerHTML = renderQuizHtml();
    wireQuiz();
  } else {
    root.innerHTML = renderResultsHtml();
    wireResults();
  }
  document.querySelector('header h1').textContent =
    state.view === 'results' ? 'Practice Assessment \u2014 Results' : 'Practice Assessment \u2014 AI Literacy & Technical Assessment';
  document.getElementById('statAttempted').textContent = totalAttempted() + ' / ' + totalQuestions();
}

/* ============================================================
   RENDER: INSTRUCTIONS SCREEN
   ============================================================ */
function renderInstructionsHtml(){
  return (
    '<div class="instr-wrap">' +
      '<div class="instr-card">' +
        '<h2>Before you begin</h2>' +
        '<div class="instr-meta"><span><b>Sections:</b> 2</span><span><b>Questions:</b> ' + totalQuestions() + ' total</span><span><b>Marks:</b> 1 mark per question</span><span><b>Suggested time:</b> ~30 minutes</span></div>' +
        '<ul>' +
          '<li>This is an unofficial <b>practice tool</b> covering two areas: <b>AI Literacy</b> and <b>Technical Assessment</b>.</li>' +
          '<li>Each section lists its questions on one scrollable page, with a running attempted-count shown in the sidebar.</li>' +
          '<li>Select one option per question. Click <b>Reset</b> beneath a question to clear your selected answer for it.</li>' +
          '<li>Use <b>Next Section</b> / <b>Previous Section</b> to move between the two sections at any time; your answers are saved automatically as you go.</li>' +
          '<li>Unlike the real assessment, this practice tool shows a full <b>score, topic-wise breakdown, and explanation for every question</b> once you submit \u2014 use it to study, not just to test yourself.</li>' +
          '<li>Click <b>Submit</b> only once you are done with both sections \u2014 you can still review everything afterwards, but answers lock once submitted.</li>' +
        '</ul>' +
        '<div class="syscheck">' +
          '<span class="sc-item"><span class="dot">\u2713</span> Browser compatibility OK</span>' +
          '<span class="sc-item"><span class="dot">\u2713</span> Local progress saving available</span>' +
          '<span class="sc-item"><span class="dot">\u2713</span> Screen size supported</span>' +
        '</div>' +
      '</div>' +
      '<div class="instr-start-row"><button class="btn" id="startNowBtn">Start Now</button></div>' +
    '</div>'
  );
}
function wireInstructions(){
  document.getElementById('startNowBtn').addEventListener('click', function(){
    state.view = 'quiz';
    state.currentSection = 1;
    renderApp();
  });
}

/* ============================================================
   RENDER: QUIZ SHELL (SIDEBAR + SECTION CONTENT)
   ============================================================ */
function renderSidebarHtml(){
  var html = '<div class="sidebar"><h3>Sections</h3>';
  SECTIONS.forEach(function(s){
    var qs = questionsFor(s.num);
    var att = attemptedCountForSection(s.num);
    var pct = qs.length ? Math.round((att / qs.length) * 100) : 0;
    var active = (state.currentSection === s.num) ? ' active' : '';
    html += '<div class="sb-section' + active + '" data-goto-section="' + s.num + '">' +
      '<div class="sb-name">' + (s.num < 10 ? '0' + s.num : s.num) + '. ' + s.name + '</div>' +
      '<div class="sb-count">' + att + ' / ' + qs.length + ' attempted</div>' +
      '<div class="sb-progress-track"><div class="sb-progress-fill" style="width:' + pct + '%;"></div></div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderOptionRow(q, opt){
  var selected = state.answers[q.id] === opt.id;
  return (
    '<label class="opt-row' + (selected ? ' selected' : '') + '" data-opt-row="' + q.id + ':' + opt.id + '">' +
      '<input type="radio" name="q_' + q.id + '" value="' + opt.id + '" ' + (selected ? 'checked' : '') + ' data-answer="' + q.id + '|' + opt.id + '">' +
      '<span class="opt-letter">' + opt.id + '.</span>' +
      '<span class="opt-text">' + real(opt.text) + '</span>' +
    '</label>'
  );
}

function renderQuestionBlock(q, displayNum){
  var answered = isAnswered(q.id);
  var optsHtml = q.options.map(function(o){ return renderOptionRow(q, o); }).join('');
  return (
    '<div class="qblock">' +
      '<div class="qnum">Q ' + (displayNum < 10 ? '0' + displayNum : displayNum) + '.' +
        ' <span class="review-flag ' + (answered ? 'answered' : 'unanswered') + '" style="margin-left:8px;">' + (answered ? 'Answered' : 'Not answered') + '</span>' +
      '</div>' +
      '<div class="qtext">' + real(q.question) + '</div>' +
      '<div class="opslabel">Ops:</div>' +
      optsHtml +
      '<div class="reset-row"><a class="linklike" data-reset-q="' + q.id + '">Reset</a></div>' +
    '</div>'
  );
}

function renderSectionContentHtml(sectionNum){
  var meta = SECTIONS.filter(function(s){ return s.num === sectionNum; })[0];
  var qs = questionsFor(sectionNum);
  var body = '';
  var lastGroup = undefined;
  qs.forEach(function(q, idx){
    if(q.scenario_group_id && q.scenario_group_id !== lastGroup){
      body += '<div class="scenario-block"><span class="sc-tag">Shared Scenario</span>' + real(q.scenario) + '</div>';
    }
    lastGroup = q.scenario_group_id || undefined;
    body += renderQuestionBlock(q, idx + 1);
  });

  var navHtml = '<div class="nav-row">';
  if(sectionNum === 1){
    navHtml += '<span></span>' +
      '<button class="pill-btn" id="nextSectionBtn"><span class="pill-tag">SECTION 01/02</span> Next Section \u2192</button>';
  } else {
    navHtml += '<button class="pill-btn" id="prevSectionBtn">\u2190 Previous Section <span class="pill-tag">SECTION 02/02</span></button>' +
      '<span></span>';
  }
  navHtml += '</div>';

  if(sectionNum === 2){
    navHtml += '<div class="submit-bar"><button class="btn green" id="submitBtn">Submit</button></div>';
  }

  return (
    '<div class="quiz-main">' +
      '<div class="sec-header">' +
        '<h2>' + (sectionNum < 10 ? '0' + sectionNum : sectionNum) + '. ' + meta.name + '</h2>' +
        '<div class="sec-sub">' + qs.length + ' questions, 1 mark each</div>' +
      '</div>' +
      '<div class="qa-body">' + body + navHtml + '</div>' +
    '</div>'
  );
}

function renderQuizHtml(){
  return '<div class="quiz-shell">' + renderSidebarHtml() + renderSectionContentHtml(state.currentSection) + '</div>';
}

function wireQuiz(){
  document.querySelectorAll('[data-goto-section]').forEach(function(el){
    el.addEventListener('click', function(){
      state.currentSection = parseInt(el.getAttribute('data-goto-section'), 10);
      renderApp();
      window.scrollTo(0, 0);
    });
  });
  document.querySelectorAll('[data-answer]').forEach(function(input){
    input.addEventListener('change', function(){
      var parts = input.getAttribute('data-answer').split('|');
      state.answers[parts[0]] = parts[1];
      renderApp();
    });
  });
  document.querySelectorAll('[data-reset-q]').forEach(function(link){
    link.addEventListener('click', function(){
      var qid = link.getAttribute('data-reset-q');
      delete state.answers[qid];
      renderApp();
    });
  });
  var nextBtn = document.getElementById('nextSectionBtn');
  if(nextBtn) nextBtn.addEventListener('click', function(){
    state.currentSection = 2;
    renderApp();
    window.scrollTo(0, 0);
  });
  var prevBtn = document.getElementById('prevSectionBtn');
  if(prevBtn) prevBtn.addEventListener('click', function(){
    state.currentSection = 1;
    renderApp();
    window.scrollTo(0, 0);
  });
  var submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.addEventListener('click', function(){
    var unanswered = totalQuestions() - totalAttempted();
    var proceed = true;
    if(unanswered > 0){
      proceed = window.confirm(unanswered + ' question(s) are not answered yet. Submit anyway?');
    }
    if(!proceed) return;
    state.submitted = true;
    state.view = 'results';
    renderApp();
    window.scrollTo(0, 0);
  });
}

/* ============================================================
   RENDER: RESULTS SCREEN
   ============================================================ */
function scoreClassFor(correct, total){
  if(total === 0) return 'mid';
  var ratio = correct / total;
  if(ratio >= 0.7) return 'good';
  if(ratio >= 0.4) return 'mid';
  return 'bad';
}

function renderResultsHtml(){
  var score = computeScore();
  var total = totalQuestions();
  var breakdown = computeTopicBreakdown();

  var topicCardsHtml = ALL_TOPICS.map(function(t){
    var b = breakdown[t];
    var cls = scoreClassFor(b.correct, b.total);
    return '<div class="topic-card"><div class="tc-name">' + t + '</div>' +
      '<div class="tc-score ' + cls + '">' + b.correct + ' / ' + b.total + ' correct</div></div>';
  }).join('');

  var reviewHtml = '';
  SECTIONS.forEach(function(s){
    reviewHtml += '<div class="review-section-title">' + (s.num < 10 ? '0' + s.num : s.num) + '. ' + s.name + ' \u2014 Full Review</div>';
    var qs = questionsFor(s.num);
    var lastGroup = undefined;
    qs.forEach(function(q, idx){
      if(q.scenario_group_id && q.scenario_group_id !== lastGroup){
        reviewHtml += '<div class="scenario-block"><span class="sc-tag">Shared Scenario</span>' + real(q.scenario) + '</div>';
      }
      lastGroup = q.scenario_group_id || undefined;

      var chosen = state.answers[q.id];
      var verdict, verdictClass;
      if(chosen === undefined){ verdict = 'Not answered'; verdictClass = 'skipped'; }
      else if(chosen === q.correct_option_id){ verdict = 'Correct'; verdictClass = 'correct'; }
      else { verdict = 'Incorrect'; verdictClass = 'incorrect'; }

      var optsHtml = q.options.map(function(o){
        var cls = '';
        if(o.id === q.correct_option_id) cls = 'is-correct';
        else if(o.id === chosen) cls = 'is-wrong-chosen';
        var tag = '';
        if(o.id === q.correct_option_id) tag = ' \u2713 Correct answer';
        else if(o.id === chosen) tag = ' \u2717 Your answer';
        return '<div class="rc-option-line ' + cls + '">' + o.id + '. ' + real(o.text) + tag + '</div>';
      }).join('');

      reviewHtml +=
        '<div class="review-card">' +
          '<div class="rc-top">' +
            '<div><span class="rc-topic-tag">' + q.topic + '</span></div>' +
            '<span class="rc-verdict ' + verdictClass + '">' + verdict + '</span>' +
          '</div>' +
          '<div class="qnum">Q ' + (idx+1 < 10 ? '0' + (idx+1) : (idx+1)) + '.</div>' +
          '<div class="qtext">' + real(q.question) + '</div>' +
          optsHtml +
          '<div class="rc-explain"><b>Explanation:</b><br>' + real(q.explanation) + '</div>' +
        '</div>';
    });
  });

  return (
    '<div class="results-wrap">' +
      '<div class="score-card">' +
        '<div class="score-num">' + score + ' / ' + total + '</div>' +
        '<div class="score-label">Your Practice Score</div>' +
      '</div>' +
      '<div class="review-section-title" style="margin-top:0;">Topic-wise Breakdown</div>' +
      '<div class="topic-grid">' + topicCardsHtml + '</div>' +
      reviewHtml +
      '<div class="results-actions"><button class="btn secondary" id="retakeBtn">Retake Practice Set</button></div>' +
    '</div>'
  );
}

function wireResults(){
  document.getElementById('retakeBtn').addEventListener('click', function(){
    var ok = window.confirm('This will clear your answers and start over. Continue?');
    if(!ok) return;
    state.view = 'instructions';
    state.currentSection = 1;
    state.answers = {};
    state.submitted = false;
    renderApp();
    window.scrollTo(0, 0);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
safeLoad();
renderApp();

</script>
</body>
</html>
