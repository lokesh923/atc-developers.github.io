 approach because it requires no preprocessing step."}, {"id": "B", "text": "Sort the array once up front (O(n log n)) and then run binary search for every lookup: O(log n) per lookup, which is the best achievable average-case complexity for repeated lookups."}, {"id": "C", "text": "Insert every element into a hash set once (O(n) total build cost), after which each lookup is O(1) on average, since hashing avoids both the linear scan of an unsorted array and the log-n comparisons of binary search."}, {"id": "D", "text": "Convert the collection into a linked list, since linked lists provide faster element lookup than arrays in every case."}], "correct_option_id": "C", "explanation": "<b>Correct: C.</b> For a static collection queried repeatedly, building a hash set once (O(n)) and then getting O(1) average-case lookups thereafter beats both a linear scan (O(n) every single lookup) and binary search (O(log n) every lookup) in the long run, since thousands of lookups amortize the one-time build cost.<br><br><b>Why the others are wrong:</b> (A) is far from \"fastest\" — O(n) per lookup across thousands of lookups is by far the slowest option here; \"no preprocessing\" doesn't make it faster overall. (B) is a genuinely reasonable approach but is not the BEST average case — O(log n) per lookup is worse than the O(1) average lookup a hash set provides. (D) is false; linked lists have O(n) lookup, worse than both arrays with binary search and hash sets — they are not \"faster in every case.\""}, {"id": "q14", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "You need to determine whether any two numbers in an array of up to 100,000 elements sum to a target value K. Which of the following statements about possible approaches is MOST accurate?", "options": [{"id": "A", "text": "Only a brute-force nested loop checking every pair (O(n²)) is guaranteed to give a correct answer; any approach that avoids checking every possible pair is unreliable."}, {"id": "B", "text": "Sorting the array and then using two pointers moving inward from both ends (O(n log n) overall) is the single fastest possible correct approach, and no approach can do better."}, {"id": "C", "text": "Using a single pass with a hash set — for each number x, check whether (K − x) is already in the set, otherwise add x to the set — is correct and needs only O(n) time and O(n) extra space, in a single left-to-right pass."}, {"id": "D", "text": "Both the sort-and-two-pointer approach (O(n log n)) and the single-pass hash-set approach (O(n)) are valid, correct, and each meaningfully better than brute force; the hash-set approach typically has the better time complexity of the two, at the cost of using more extra memory."}], "correct_option_id": "D", "explanation": "<b>Correct: D.</b> This is the nuanced, fully accurate statement: the sort + two-pointer method is O(n log n) time with O(1) extra space (or O(n) if sorting isn't in-place), and is correct; the hash-set method is O(n) time but O(n) extra space, and is also correct. Both comfortably beat brute-force O(n²), and between the two, the hash-set approach has the better asymptotic time complexity, trading additional memory for that speed.<br><br><b>Why the others are wrong:</b> (A) is false — both alternative approaches described are provably correct, not just brute force. (B) is false because it ignores the hash-set approach, which is faster in time complexity (O(n) vs O(n log n)), so two-pointer is not \"the fastest possible.\" (C) is true on its own but is not the MOST accurate/complete answer among the options, since it omits the equally valid two-pointer approach and the comparison between the two — which (D) captures fully."}, {"id": "q15", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "A recursive function computes <code>fibonacci(n)</code> using the naive definition <code>fibonacci(n) = fibonacci(n-1) + fibonacci(n-2)</code>, with two recursive calls at every step and no memoization/caching of previously computed results. What are the time complexity and space complexity of this naive approach, respectively?", "options": [{"id": "A", "text": "Time O(n), Space O(n) — recursion depth always determines both time and space equally."}, {"id": "B", "text": "Time O(2ⁿ), Space O(n) — the call tree branches exponentially, giving exponential total work, but the maximum recursion depth on the call stack at any single moment is only proportional to n, since deeper branches are fully resolved and popped off the stack before sibling branches are explored."}, {"id": "C", "text": "Time O(2ⁿ), Space O(2ⁿ) — since there are exponentially many total function calls made over the life of the computation, all of them must exist in memory simultaneously."}, {"id": "D", "text": "Time O(n²), Space O(1) — the two recursive calls at each level behave equivalently to two nested loops, and recursion itself uses no stack memory."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> The naive recursive Fibonacci makes roughly 2ⁿ total calls (exponential time), but space complexity is governed by the maximum depth of the call stack at any one time — not by the total number of calls ever made across the whole execution. Since recursive calls resolve and pop off the stack (depth-first) before siblings are explored, the deepest the stack ever gets is O(n).<br><br><b>Why the others are wrong:</b> (A) understates the time complexity — it is not linear, it's exponential, due to massively redundant recomputation of the same subproblems. (C) is the classic misconception this question targets: confusing \"total calls made over time\" with \"calls that must be in memory at the same time\" — the call stack doesn't retain every call that has already returned. (D) is wrong on both counts: the time is exponential, not quadratic, and recursion inherently uses stack memory (proportional to depth), so space is not O(1)."}, {"id": "q46", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "You need to check whether two strings of length n (lowercase English letters) are anagrams, for millions of pairs. Which approach is most efficient and why?", "options": [{"id": "A", "text": "Generate all permutations of the first string and check whether the second is among them &mdash; O(n!)."}, {"id": "B", "text": "Count the frequency of each of the 26 letters in both strings (a hash map or fixed-size array) and compare the counts &mdash; O(n) time and O(1) extra space for a fixed alphabet."}, {"id": "C", "text": "Sort both strings and compare them &mdash; O(n log n), which is the theoretical best possible."}, {"id": "D", "text": "Compare the strings character by character at the same positions &mdash; O(n)."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Anagrams have identical character counts. Counting in one pass is linear, and the 26-slot array is constant space &mdash; better than sorting.<br><br><b>Why the others are wrong:</b> (A) Factorial time is hopeless beyond tiny n. (C) Sorting is correct but O(n log n), so it is not the best possible. (D) Position-by-position comparison checks equality, not anagrams (\"listen\" vs \"silent\" would fail)."}, {"id": "q47", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "A developer runs binary search on an <b>unsorted</b> list of employee IDs and it sometimes reports that an ID is missing even though it is present. Why?", "options": [{"id": "A", "text": "Binary search only works on lists with an even number of elements."}, {"id": "B", "text": "Binary search relies on the list being sorted: each comparison discards half the list on the assumption that everything on one side is smaller. On unsorted data that assumption is false, so the target can be discarded."}, {"id": "C", "text": "Binary search has a random component that occasionally fails."}, {"id": "D", "text": "The list is too large; binary search only works on lists under 1,000 elements."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> The O(log n) guarantee comes from the sorted-order invariant. Without it the algorithm may eliminate the half that contains the target. Sort first (O(n log n)), or use a hash set for membership checks.<br><br><b>Why the others are wrong:</b> (A) Binary search works for any length. (C) Binary search is fully deterministic. (D) It is especially valuable for very large sorted lists."}, {"id": "q48", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "An HR list is already sorted by employee name. It is then sorted by department. Afterwards, employees inside each department are still in name order. Which property of the second sort guarantees this?", "options": [{"id": "A", "text": "The sort is stable: elements with equal keys (the same department) keep their existing relative order, so the earlier name ordering is preserved within each department."}, {"id": "B", "text": "The sort is in-place, which always preserves previous orderings."}, {"id": "C", "text": "The sort has O(n log n) complexity, which guarantees name order."}, {"id": "D", "text": "Sorting twice always produces a combined ordering in every algorithm."}], "correct_option_id": "A", "explanation": "<b>Correct: A.</b> Stability is exactly the property that equal keys keep their input order. Stable algorithms (merge sort, Timsort) support this multi-key sorting pattern; unstable ones (typical quicksort, heapsort) do not guarantee it.<br><br><b>Why the others are wrong:</b> (B) In-place refers to memory use, not order preservation &mdash; many in-place sorts are unstable. (C) Complexity says nothing about stability. (D) An unstable second sort can scramble the name order."}, {"id": "q49", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "A code editor must check whether brackets such as <code>{[()]}</code> are balanced. Which data structure fits naturally, and how?", "options": [{"id": "A", "text": "A queue: enqueue every bracket and check that the first and last are equal."}, {"id": "B", "text": "A sorted array: sort the brackets and check that each opening bracket is next to its closing one."}, {"id": "C", "text": "A hash set of all opening brackets seen so far."}, {"id": "D", "text": "A stack: push each opening bracket; on a closing bracket, pop and check that it matches; the string is balanced only if every pop matches and the stack is empty at the end &mdash; O(n) time."}], "correct_option_id": "D", "explanation": "<b>Correct: D.</b> Bracket matching is last-in, first-out: the most recently opened bracket must close first, which is exactly what a stack models.<br><br><b>Why the others are wrong:</b> (A) A queue is FIFO, the wrong order for nesting. (B) Sorting destroys the positional information that defines nesting. (C) A set loses both order and counts (for example \"((\" versus \"(\")."}, {"id": "q50", "section": 2, "topic": "Data Structures & Algorithms", "scenario_group_id": null, "scenario": null, "question": "Given daily sales for 365 days, you need the maximum total of any 7 consecutive days. Which approach is best?", "options": [{"id": "A", "text": "For every start day, add up the next 7 values &mdash; O(n&middot;k), which is optimal."}, {"id": "B", "text": "Sort the sales and add the 7 largest values."}, {"id": "C", "text": "Use a sliding window: compute the first 7-day sum, then for each next day add the new value and subtract the value leaving the window, tracking the maximum &mdash; O(n)."}, {"id": "D", "text": "Use binary search on the sales array."}], "correct_option_id": "C", "explanation": "<b>Correct: C.</b> The sliding-window pattern reuses the previous window's sum, turning repeated work into one addition and one subtraction per step &mdash; a classic example of recognising a pattern and decomposing a problem.<br><br><b>Why the others are wrong:</b> (A) This is correct but does redundant work, so it is not optimal. (B) Sorting destroys the \"consecutive days\" constraint. (D) Binary search does not apply to this problem."}, {"id": "q16", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "A codebase defines a base class <code>Shape</code> with a method <code>calculateArea()</code>, and subclasses <code>Circle</code> and <code>Square</code> each override it with their own formula. Elsewhere in the code:<br><br><pre style=\"background:#1E2530;color:#D8E2EC;border-radius:6px;padding:10px 14px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre;\">totalArea = 0\nfor shape in shapes:   // a mixed list of Circle and Square objects\n    totalArea += shape.calculateArea()</pre>This loop correctly computes the right area for each shape without ever checking what specific type each shape is. Which OOP principle is being demonstrated here?", "options": [{"id": "A", "text": "Encapsulation — because each shape class hides its internal data fields from other classes in the codebase."}, {"id": "B", "text": "Polymorphism — because the same method call, <code>calculateArea()</code>, automatically invokes the correct overridden implementation based on each object's actual runtime type, without the calling code needing to know or check which subclass it's dealing with."}, {"id": "C", "text": "Inheritance — because Circle and Square inherit from Shape, and inheritance by itself is what guarantees the correct area formula is used for each object."}, {"id": "D", "text": "Abstraction — because the base Shape class hides the specific mathematical formula used to calculate area from the rest of the program."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> This is the defining example of polymorphism: identical calling code (<code>shape.calculateArea()</code>) produces behavior appropriate to each object's actual runtime type. The loop never branches on type, yet gets the right formula every time — that's runtime method dispatch, i.e., polymorphism.<br><br><b>Why the others are wrong:</b> (A) describes a different principle (hiding internal data/state), which isn't what's being shown — the example is about method behavior selection, not data hiding. (C) is a very common near-miss: inheritance alone (subclasses existing) doesn't guarantee correct dispatch by itself — it's specifically the ability to override and have the right override selected at runtime (polymorphism) that makes the loop work; inheritance is a prerequisite, not the mechanism demonstrated. (D) also describes a different principle (simplifying/hiding complexity behind an interface); the loop's correctness comes from dynamic dispatch, not from formulas being hidden."}, {"id": "q17", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "Consider this SQL query:<br><br><pre style=\"background:#1E2530;color:#D8E2EC;border-radius:6px;padding:10px 14px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre;\">SELECT customers.name, COUNT(orders.id) AS order_count\nFROM customers\nLEFT JOIN orders ON customers.id = orders.customer_id\nGROUP BY customers.name\nHAVING COUNT(orders.id) = 0;</pre>What does this query return?", "options": [{"id": "A", "text": "All customers along with how many orders each one has placed, sorted from fewest to most orders."}, {"id": "B", "text": "Only customers who have never placed an order, because the LEFT JOIN keeps every customer row even when there's no matching order (producing NULLs for the order columns), and the HAVING clause then filters the grouped results down to just those groups whose order count is zero."}, {"id": "C", "text": "This query throws an error, because HAVING can never be used together with COUNT() unless a WHERE clause is also present in the same query."}, {"id": "D", "text": "Only orders that have no associated customer record, as a direct result of the LEFT JOIN's direction."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> LEFT JOIN preserves every row from <code>customers</code> even when there's no matching row in <code>orders</code> (those columns come back NULL, and <code>COUNT(orders.id)</code> counts 0 for such a customer). Grouping by customer and then filtering with <code>HAVING COUNT(orders.id) = 0</code> keeps exactly the customers whose order count is zero — i.e., customers with no orders at all.<br><br><b>Why the others are wrong:</b> (A) describes what the query would do WITHOUT the HAVING clause filtering it down, and there's also no ORDER BY here so nothing guarantees sorting by count. (C) is false — HAVING filtering on an aggregate like COUNT() is standard SQL and does not require a WHERE clause to be present. (D) has the join direction's implication backwards; LEFT JOIN keeps unmatched rows from the LEFT table (customers), not orphaned rows from the right table (orders)."}, {"id": "q18", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "An API endpoint <code>/orders/42</code> supports GET, PUT, PATCH, and DELETE. A client wants to update ONLY the <code>status</code> field of order 42 (from \"pending\" to \"shipped\") without resending every other field of the order. Which HTTP method is most appropriate here, and why?", "options": [{"id": "A", "text": "PUT, because PUT is the correct method for any kind of update to a resource, regardless of whether the full resource representation is sent or only a subset of fields."}, {"id": "B", "text": "PATCH, because it is specifically designed for partial updates to a resource, whereas PUT is conventionally expected to replace the entire resource with exactly what's provided in the request (meaning fields left out of a PUT request may be reset/cleared rather than left untouched)."}, {"id": "C", "text": "POST, because POST is the only HTTP method in REST that is capable of modifying data that already exists on the server."}, {"id": "D", "text": "GET, since modern REST API conventions allow GET requests to include a request body carrying the update data."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> PATCH exists precisely for partial updates: sending just the changed field(s). PUT's REST convention is full-resource replacement — using PUT with only <code>status</code> risks other fields being wiped/reset depending on server implementation, which is exactly the ambiguity PATCH avoids here.<br><br><b>Why the others are wrong:</b> (A) misstates PUT's semantics; PUT's conventional contract is \"replace the whole resource,\" which is precisely why it's the wrong choice for a partial field update. (C) is false; PUT, PATCH, and DELETE are all standard REST methods that modify existing server data, and POST is conventionally for creating new resources (though it's occasionally reused for actions, it's not \"the only\" method capable of modification). (D) is false; GET is conventionally defined as a safe, read-only method and is not the mechanism for sending update payloads in REST APIs."}, {"id": "q51", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "Two developers edit the same lines of <code>payment.py</code> on different branches. When the second one runs <code>git merge</code>, Git stops with a conflict. What is the correct understanding and next step?", "options": [{"id": "A", "text": "Git has lost the first developer's work and it must be recovered from backups."}, {"id": "B", "text": "Git cannot decide automatically between two different changes to the same lines, so it marks the conflict in the file; the developer must edit the file to combine the changes correctly, test it, then <code>git add</code> and commit to complete the merge."}, {"id": "C", "text": "The only option is to delete the branch and redo the work from scratch."}, {"id": "D", "text": "Running <code>git push --force</code> resolves conflicts automatically."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Merge conflicts are a normal part of version control: both versions are preserved in the file between conflict markers, and a human decides the correct result before committing the merge.<br><br><b>Why the others are wrong:</b> (A) No work is lost; both sides are kept. (C) Redoing the work is unnecessary. (D) Force-pushing overwrites remote history and can destroy teammates' work &mdash; it does not resolve anything."}, {"id": "q52", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "You need the departments that have <b>more than 5</b> employees. Which SQL is correct?", "options": [{"id": "A", "text": "<code>SELECT department FROM employees WHERE COUNT(*) &gt; 5 GROUP BY department;</code>"}, {"id": "B", "text": "<code>SELECT department, COUNT(*) FROM employees GROUP BY department WHERE COUNT(*) &gt; 5;</code>"}, {"id": "C", "text": "<code>SELECT department, COUNT(*) FROM employees ORDER BY department HAVING COUNT(*) &gt; 5;</code>"}, {"id": "D", "text": "<code>SELECT department, COUNT(*) AS headcount FROM employees GROUP BY department HAVING COUNT(*) &gt; 5;</code>"}], "correct_option_id": "D", "explanation": "<b>Correct: D.</b> <code>WHERE</code> filters rows <i>before</i> grouping; <code>HAVING</code> filters groups <i>after</i> aggregation. A condition on <code>COUNT(*)</code> therefore belongs in <code>HAVING</code>, after <code>GROUP BY</code>.<br><br><b>Why the others are wrong:</b> (A) Aggregate functions are not allowed in <code>WHERE</code>. (B) <code>WHERE</code> cannot come after <code>GROUP BY</code>, and cannot use an aggregate. (C) There is no <code>GROUP BY</code>, so the count is not per department, and <code>HAVING</code> cannot follow <code>ORDER BY</code>."}, {"id": "q53", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "A money-transfer feature debits account A and then credits account B. The server crashes after the debit but before the credit, and the money disappears. Which DBMS concept prevents this?", "options": [{"id": "A", "text": "Wrap both updates in a single transaction so that they are atomic (ACID): either both commit or, on failure, both are rolled back, and the database never keeps a half-finished transfer."}, {"id": "B", "text": "Add an index on the account number column."}, {"id": "C", "text": "Normalise the accounts table to third normal form."}, {"id": "D", "text": "Run the credit before the debit."}], "correct_option_id": "A", "explanation": "<b>Correct: A.</b> Atomicity guarantees all-or-nothing execution of a group of operations. This is the textbook reason transactions exist for transfers.<br><br><b>Why the others are wrong:</b> (B) Indexes speed up lookups; they do not provide atomicity. (C) Normalisation reduces redundancy; it does not protect multi-step updates. (D) Reordering only changes which partial state is left behind (money created instead of lost)."}, {"id": "q54", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "A logged-in user with a valid session calls <code>DELETE /admin/users/17</code>, but their role does not allow admin actions. Which HTTP status code should a well-designed REST API return?", "options": [{"id": "A", "text": "200 OK, with an error message in the body."}, {"id": "B", "text": "401 Unauthorized."}, {"id": "C", "text": "403 Forbidden &mdash; the server knows who the user is (authenticated) but they are not allowed to perform this action (not authorised)."}, {"id": "D", "text": "404 Not Found, in every case."}], "correct_option_id": "C", "explanation": "<b>Correct: C.</b> 401 means \"not authenticated &mdash; provide valid credentials\"; 403 means \"authenticated, but not permitted\". This user is authenticated but lacks permission, so 403 is correct.<br><br><b>Why the others are wrong:</b> (A) Returning 200 for a failed operation breaks HTTP semantics for clients. (B) 401 is for missing or invalid credentials, which is not the case here. (D) Some APIs return 404 to hide a resource's existence, but that is a special hardening choice, not the standard meaning for a known but forbidden action."}, {"id": "q55", "section": 2, "topic": "Software Engineering Fundamentals", "scenario_group_id": null, "scenario": null, "question": "In a banking app, other classes change <code>account.balance</code> directly (for example <code>account.balance = -5000</code>), causing invalid negative balances. Which OOP principle best addresses this?", "options": [{"id": "A", "text": "Inheritance: create a <code>SavingsAccount</code> subclass."}, {"id": "B", "text": "Polymorphism: override <code>toString()</code> to display the balance."}, {"id": "C", "text": "Abstraction: rename the field to <code>amount</code>."}, {"id": "D", "text": "Encapsulation: make <code>balance</code> private and expose methods such as <code>deposit()</code> and <code>withdraw()</code> that validate the rules (no negative amounts, sufficient funds) before changing the state."}], "correct_option_id": "D", "explanation": "<b>Correct: D.</b> Encapsulation hides internal state and allows changes only through methods that enforce the class's invariants, so an invalid balance can no longer be set from outside.<br><br><b>Why the others are wrong:</b> (A) A subclass still exposes the same public field. (B) Changing how the balance is displayed does not protect it. (C) Renaming the field changes nothing about access."}, {"id": "q19", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "A mobile app embeds a static, long-lived API key directly inside its client-side code to authenticate requests to a backend service. A security review flags this practice as risky. What is the most accurate reason this is a genuine security concern, and what is the better practice?", "options": [{"id": "A", "text": "It isn't actually a concern; API keys are designed to be public information, similar to a username, so embedding one in client code is standard and safe practice."}, {"id": "B", "text": "Anything shipped inside client-side code (the compiled app binary) can be extracted or decompiled by anyone who downloads the app, so a static embedded key is effectively public and can be abused (e.g., for unauthorized usage or unexpected billing); the better practice is for the backend to issue short-lived, narrowly-scoped tokens after properly authenticating the user, instead of shipping a long-lived secret inside the client."}, {"id": "C", "text": "The only real concern is that the key might eventually expire, so the correct fix is to use a key configured to never expire."}, {"id": "D", "text": "This is exclusively an Android-specific concern, since Android apps are open-source by default, whereas iOS apps are fully immune to this kind of extraction."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Client-side code, including mobile app binaries, is fundamentally reachable and reverse-engineerable by the end user (and anyone else who obtains the app). A long-lived embedded secret is therefore not truly secret. The standard mitigation is server-issued, short-lived, scoped tokens tied to an authenticated session, minimizing the blast radius if one leaks.<br><br><b>Why the others are wrong:</b> (A) confuses \"API keys can identify a client\" with \"API keys are safe to expose,\" which is not true for keys meant to gate access/billing. (C) misidentifies the core problem as expiry rather than exposure/extractability — a non-expiring key embedded in client code is actually worse, since it never becomes invalid even after being extracted. (D) is false; both Android and iOS app binaries can be decompiled/inspected by a determined attacker, so this is a platform-independent concern, not an Android-only one."}, {"id": "q20", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "A team currently deploys their application by manually installing dependencies on a virtual machine, and deployments frequently break with \"it works on my machine but not in production,\" caused by differing library versions and OS packages between environments. They are evaluating containerizing the app with Docker as part of adopting a CI/CD pipeline. What is the most accurate benefit Docker specifically provides for this problem?", "options": [{"id": "A", "text": "Docker automatically analyzes and rewrites the application's source code to fix bugs, which is what eliminates \"works on my machine\" issues entirely."}, {"id": "B", "text": "Docker packages the application together with its exact dependencies, libraries, and runtime environment into a single portable image, so the same container runs consistently across development, CI, and production — largely eliminating environment-mismatch issues, though it doesn't by itself replace good CI/CD practices, testing, or configuration management."}, {"id": "C", "text": "Docker replaces the need for version control entirely, since container images already track every historical code change made to the application."}, {"id": "D", "text": "Docker is itself a cloud hosting provider, so containerizing an app with Docker automatically deploys it to a cloud data center with no further configuration needed."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Docker's core value proposition is environment consistency: the image bundles the app with its exact dependency versions and OS-level packages, so \"works on my machine\" issues caused by environment drift are largely eliminated — the same image runs the same way everywhere. It is a packaging/runtime tool, not a replacement for testing or CI/CD discipline.<br><br><b>Why the others are wrong:</b> (A) is a fabricated capability; Docker has no code-fixing intelligence, it only packages what it's given. (C) confuses containerization with version control; Docker images capture a snapshot of a built environment, not a commit history of source code changes — Git (or similar) is still needed for that. (D) misidentifies what Docker is; Docker is a containerization technology, not a cloud provider, and using it does not by itself deploy anything anywhere without separate infrastructure/hosting setup."}, {"id": "q56", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "During a sale, a web application running on a single server slows to a crawl. The team moves to several identical app servers behind a load balancer, but users are randomly logged out. What is the most likely cause, and the fix?", "options": [{"id": "A", "text": "The load balancer is deleting cookies; a load balancer should never be used."}, {"id": "B", "text": "Sessions are stored in each server's local memory, so a request routed to a different server does not find the session; make the servers stateless by storing sessions in a shared store (such as Redis or a database) or by using signed tokens, so any server can handle any request."}, {"id": "C", "text": "More servers always cause logouts; the only fix is to buy one much larger server."}, {"id": "D", "text": "The users' browsers do not support load balancing."}], "correct_option_id": "B", "explanation": "<b>Correct: B.</b> Horizontal scaling behind a load balancer requires stateless application servers. Session state must live somewhere shared (or in a verifiable token) so requests can go to any instance &mdash; the standard client&ndash;server and cloud scaling pattern.<br><br><b>Why the others are wrong:</b> (A) Load balancers are essential for scaling; the design of session storage is the problem. (C) Vertical scaling has limits and a single point of failure; horizontal scaling works when servers are stateless. (D) Browsers are unaware of server-side load balancing."}, {"id": "q57", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "Users report that <code>app.company.com</code> will not open (\"server not found\"), but the operations team can reach the application by typing its IP address directly. Where is the problem most likely to be?", "options": [{"id": "A", "text": "DNS: the domain name is not resolving to the correct IP address (for example an expired record, a wrong DNS entry or a propagation delay), while the server itself is up."}, {"id": "B", "text": "The application's database is down."}, {"id": "C", "text": "The users' keyboards are faulty."}, {"id": "D", "text": "HTTPS certificates are only valid for IP addresses."}], "correct_option_id": "A", "explanation": "<b>Correct: A.</b> Reaching the server by IP but not by name isolates the failure to name resolution. DNS translates domain names into IP addresses; if that step fails, clients cannot find the server even though it is healthy.<br><br><b>Why the others are wrong:</b> (B) A database outage would give application errors, not \"server not found\", and access by IP would fail too. (C) Irrelevant. (D) Certificates are normally issued for domain names; this is not the cause of the symptom."}, {"id": "q58", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "An employee receives an urgent email that appears to come from IT: <i>\"Your password expires today &mdash; log in here to keep your account,\"</i> linking to <code>c0mpany-login.help</code>. Which response and control best reflect cybersecurity basics?", "options": [{"id": "A", "text": "Click the link quickly, since password expiry is urgent."}, {"id": "B", "text": "Reply to the email with the password, so IT can reset it."}, {"id": "C", "text": "Forward the email to all colleagues to warn them, including the link so they can check it."}, {"id": "D", "text": "Treat it as phishing: do not click or enter credentials, verify through the official IT portal or helpdesk, report it using the phishing-report process, and rely on multi-factor authentication so that a stolen password alone cannot give access."}], "correct_option_id": "D", "explanation": "<b>Correct: D.</b> Urgency, a look-alike domain and a credential request are classic phishing signs. Verifying through known channels, reporting, and MFA are standard defences.<br><br><b>Why the others are wrong:</b> (A) Urgency is a manipulation tactic. (B) Legitimate IT teams never ask for passwords by email. (C) Spreading the malicious link increases the risk; the proper reporting channel should be used instead."}, {"id": "q59", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "Midway through a two-week Scrum sprint, the client asks for a new feature to be added immediately. What does good Agile practice suggest?", "options": [{"id": "A", "text": "Silently add the feature and work overtime, without telling the product owner."}, {"id": "B", "text": "Refuse all changes until the project ends."}, {"id": "C", "text": "The product owner evaluates and prioritises the request in the product backlog; unless it is urgent enough to justify changing the sprint goal (agreed with the team), it is planned into an upcoming sprint, keeping the current sprint focused and predictable."}, {"id": "D", "text": "Cancel the sprint every time a new request arrives."}], "correct_option_id": "C", "explanation": "<b>Correct: C.</b> Scrum embraces change through the backlog, managed by the product owner, while protecting the sprint's goal. Changes enter via prioritisation, not ad hoc mid-sprint scope creep.<br><br><b>Why the others are wrong:</b> (A) Hidden work breaks transparency and planning. (B) Agile is meant to welcome change, just in a controlled way. (D) Cancelling a sprint is a rare, drastic step reserved for when the sprint goal becomes obsolete."}, {"id": "q60", "section": 2, "topic": "Modern Engineering Awareness", "scenario_group_id": null, "scenario": null, "question": "A team adopts a CI/CD pipeline: every commit triggers an automated build, unit and integration tests, and security scans, and deployment happens only if all stages pass. A commit fails the integration tests. What happens, and why is this valuable (DevOps)?", "options": [{"id": "A", "text": "The pipeline blocks the deployment and notifies the team, so the defect is caught minutes after it is introduced, when it is cheapest to fix, instead of reaching production."}, {"id": "B", "text": "The pipeline deploys anyway, because CI/CD prioritises speed over quality."}, {"id": "C", "text": "The pipeline automatically rewrites the code so that the tests pass."}, {"id": "D", "text": "Nothing is reported until the next monthly release review."}], "correct_option_id": "A", "explanation": "<b>Correct: A.</b> CI/CD provides fast, automated feedback and quality gates: failing stages stop the release, so problems are found early and fixed quickly &mdash; a core DevOps principle.<br><br><b>Why the others are wrong:</b> (B) Quality gates exist precisely to prevent broken builds from being deployed. (C) Pipelines run the checks; they do not fix code. (D) Continuous integration gives feedback on every commit, not monthly."}];
var SECTIONS = [{"num": 1, "name": "AI Literacy", "short": "ai_literacy"}, {"num": 2, "name": "Technical Assessment", "short": "technical"}];
var ALL_TOPICS = ["AI Foundations & Generative AI", "Prompt Engineering & AI Productivity", "Advanced AI Systems", "Responsible AI & AI Evaluation", "Programming Logic & Problem Solving", "Data Structures & Algorithms", "Software Engineering Fundamentals", "Modern Engineering Awareness"];

var STORAGE_KEY = 'aiLiteracyTechPractice:v2';

function questionsFor(sectionNum){
  return QUESTIONS.filter(function(q){ return q.section === sectionNum; });
}
function totalQuestions(){ return QUESTIONS.length; }

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
var state = {
  view: 'instructions',   // 'instructions' | 'quiz' | 'results'
  currentSection: 1,
  answers: {},            // { qid: optionId }
  submitted: false
};

function safeLoad(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object'){
      state.view = parsed.view || 'instructions';
      state.currentSection = parsed.currentSection || 1;
      state.answers = parsed.answers || {};
      state.submitted = !!parsed.submitted;
    }
  }catch(e){ /* ignore corrupt/blocked storage */ }
}
function safeSave(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      view: state.view,
      currentSection: state.currentSection,
      answers: state.answers,
      submitted: state.submitted
    }));
  }catch(e){ /* ignore quota/privacy errors */ }
}

/* ============================================================
   SCORING HELPERS
   ============================================================ */
function isAnswered(qid){ return Object.prototype.hasOwnProperty.call(state.answers, qid); }
function attemptedCountForSection(sectionNum){
  var qs = questionsFor(sectionNum);
  var n = 0;
  qs.forEach(function(q){ if(isAnswered(q.id)) n++; });
  return n;
}
function totalAttempted(){
  var n = 0;
  QUESTIONS.forEach(function(q){ if(isAnswered(q.id)) n++; });
  return n;
}
function computeScore(){
  var correct = 0;
  QUESTIONS.forEach(function(q){
    if(state.answers[q.id] === q.correct_option_id) correct++;
  });
  return correct;
}
function computeTopicBreakdown(){
  var map = {};
  ALL_TOPICS.forEach(function(t){ map[t] = { correct: 0, total: 0 }; });
  QUESTIONS.forEach(function(q){
    map[q.topic].total++;
    if(state.answers[q.id] === q.correct_option_id) map[q.topic].correct++;
  });
  return map;
}

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(s){
  return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
}
function optionLetterText(q, id){
  for(var i=0;i<q.options.length;i++){ if(q.options[i].id === id) return q.options[i].text; }
  return '';
}

/* ============================================================
   RENDER: TOP-LEVEL
   ============================================================ */
function renderApp(){
  safeSave();
  var root = document.getElementById('appRoot');
  if(state.view === 'instructions'){
    root.innerHTML = renderInstructionsHtml();
    wireInstructions();
  } else if(state.view === 'quiz'){
    root.innerHTML = renderQuizHtml();
    wireQuiz();
  } else {
    root.innerHTML = renderResultsHtml();
    wireResults();
  }
  document.querySelector('header h1').textContent =
    state.view === 'results' ? 'Practice Assessment \u2014 Results' : 'Practice Assessment \u2014 AI Literacy & Technical Assessment';
  document.getElementById('statAttempted').textContent = totalAttempted() + ' / ' + totalQuestions();
}

/* ============================================================
   RENDER: INSTRUCTIONS SCREEN
   ============================================================ */
function renderInstructionsHtml(){
  return (
    '<div class="instr-wrap">' +
      '<div class="instr-card">' +
        '<h2>Before you begin</h2>' +
        '<div class="instr-meta"><span><b>Sections:</b> 2</span><span><b>Questions:</b> ' + totalQuestions() + ' total</span><span><b>Marks:</b> 1 mark per question</span><span><b>Suggested time:</b> ~60 minutes</span></div>' +
        '<ul>' +
          '<li>This is an unofficial <b>practice tool</b> covering two areas: <b>AI Literacy</b> and <b>Technical Assessment</b>.</li>' +
          '<li>Each section lists its questions on one scrollable page, with a running attempted-count shown in the sidebar.</li>' +
          '<li>Select one option per question. Click <b>Reset</b> beneath a question to clear your selected answer for it.</li>' +
          '<li>Use <b>Next Section</b> / <b>Previous Section</b> to move between the two sections at any time; your answers are saved automatically as you go.</li>' +
          '<li>Unlike the real assessment, this practice tool shows a full <b>score, topic-wise breakdown, and explanation for every question</b> once you submit \u2014 use it to study, not just to test yourself.</li>' +
          '<li>Click <b>Submit</b> only once you are done with both sections \u2014 you can still review everything afterwards, but answers lock once submitted.</li>' +
        '</ul>' +
        '<div class="syscheck">' +
          '<span class="sc-item"><span class="dot">\u2713</span> Browser compatibility OK</span>' +
          '<span class="sc-item"><span class="dot">\u2713</span> Local progress saving available</span>' +
          '<span class="sc-item"><span class="dot">\u2713</span> Screen size supported</span>' +
        '</div>' +
      '</div>' +
      '<div class="instr-start-row"><button class="btn" id="startNowBtn">Start Now</button></div>' +
    '</div>'
  );
}
function wireInstructions(){
  document.getElementById('startNowBtn').addEventListener('click', function(){
    state.view = 'quiz';
    state.currentSection = 1;
    renderApp();
  });
}

/* ============================================================
   RENDER: QUIZ SHELL (SIDEBAR + SECTION CONTENT)
   ============================================================ */
function renderSidebarHtml(){
  var html = '<div class="sidebar"><h3>Sections</h3>';
  SECTIONS.forEach(function(s){
    var qs = questionsFor(s.num);
    var att = attemptedCountForSection(s.num);
    var pct = qs.length ? Math.round((att / qs.length) * 100) : 0;
    var active = (state.currentSection === s.num) ? ' active' : '';
    html += '<div class="sb-section' + active + '" data-goto-section="' + s.num + '">' +
      '<div class="sb-name">' + (s.num < 10 ? '0' + s.num : s.num) + '. ' + s.name + '</div>' +
      '<div class="sb-count">' + att + ' / ' + qs.length + ' attempted</div>' +
      '<div class="sb-progress-track"><div class="sb-progress-fill" style="width:' + pct + '%;"></div></div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderOptionRow(q, opt){
  var selected = state.answers[q.id] === opt.id;
  return (
    '<label class="opt-row' + (selected ? ' selected' : '') + '" data-opt-row="' + q.id + ':' + opt.id + '">' +
      '<input type="radio" name="q_' + q.id + '" value="' + opt.id + '" ' + (selected ? 'checked' : '') + ' data-answer="' + q.id + '|' + opt.id + '">' +
      '<span class="opt-letter">' + opt.id + '.</span>' +
      '<span class="opt-text">' + real(opt.text) + '</span>' +
    '</label>'
  );
}

function renderQuestionBlock(q, displayNum){
  var answered = isAnswered(q.id);
  var optsHtml = q.options.map(function(o){ return renderOptionRow(q, o); }).join('');
  return (
    '<div class="qblock">' +
      '<div class="qnum">Q ' + (displayNum < 10 ? '0' + displayNum : displayNum) + '.' +
        ' <span class="review-flag ' + (answered ? 'answered' : 'unanswered') + '" style="margin-left:8px;">' + (answered ? 'Answered' : 'Not answered') + '</span>' +
      '</div>' +
      '<div class="qtext">' + real(q.question) + '</div>' +
      '<div class="opslabel">Ops:</div>' +
      optsHtml +
      '<div class="reset-row"><a class="linklike" data-reset-q="' + q.id + '">Reset</a></div>' +
    '</div>'
  );
}

function renderSectionContentHtml(sectionNum){
  var meta = SECTIONS.filter(function(s){ return s.num === sectionNum; })[0];
  var qs = questionsFor(sectionNum);
  var body = '';
  var lastGroup = undefined;
  qs.forEach(function(q, idx){
    if(q.scenario_group_id && q.scenario_group_id !== lastGroup){
      body += '<div class="scenario-block"><span class="sc-tag">Shared Scenario</span>' + real(q.scenario) + '</div>';
    }
    lastGroup = q.scenario_group_id || undefined;
    body += renderQuestionBlock(q, idx + 1);
  });

  var navHtml = '<div class="nav-row">';
  if(sectionNum === 1){
    navHtml += '<span></span>' +
      '<button class="pill-btn" id="nextSectionBtn"><span class="pill-tag">SECTION 01/02</span> Next Section \u2192</button>';
  } else {
    navHtml += '<button class="pill-btn" id="prevSectionBtn">\u2190 Previous Section <span class="pill-tag">SECTION 02/02</span></button>' +
      '<span></span>';
  }
  navHtml += '</div>';

  if(sectionNum === 2){
    navHtml += '<div class="submit-bar"><button class="btn green" id="submitBtn">Submit</button></div>';
  }

  return (
    '<div class="quiz-main">' +
      '<div class="sec-header">' +
        '<h2>' + (sectionNum < 10 ? '0' + sectionNum : sectionNum) + '. ' + meta.name + '</h2>' +
        '<div class="sec-sub">' + qs.length + ' questions, 1 mark each</div>' +
      '</div>' +
      '<div class="qa-body">' + body + navHtml + '</div>' +
    '</div>'
  );
}

function renderQuizHtml(){
  return '<div class="quiz-shell">' + renderSidebarHtml() + renderSectionContentHtml(state.currentSection) + '</div>';
}

function wireQuiz(){
  document.querySelectorAll('[data-goto-section]').forEach(function(el){
    el.addEventListener('click', function(){
      state.currentSection = parseInt(el.getAttribute('data-goto-section'), 10);
      renderApp();
      window.scrollTo(0, 0);
    });
  });
  document.querySelectorAll('[data-answer]').forEach(function(input){
    input.addEventListener('change', function(){
      var parts = input.getAttribute('data-answer').split('|');
      state.answers[parts[0]] = parts[1];
      renderApp();
    });
  });
  document.querySelectorAll('[data-reset-q]').forEach(function(link){
    link.addEventListener('click', function(){
      var qid = link.getAttribute('data-reset-q');
      delete state.answers[qid];
      renderApp();
    });
  });
  var nextBtn = document.getElementById('nextSectionBtn');
  if(nextBtn) nextBtn.addEventListener('click', function(){
    state.currentSection = 2;
    renderApp();
    window.scrollTo(0, 0);
  });
  var prevBtn = document.getElementById('prevSectionBtn');
  if(prevBtn) prevBtn.addEventListener('click', function(){
    state.currentSection = 1;
    renderApp();
    window.scrollTo(0, 0);
  });
  var submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.addEventListener('click', function(){
    var unanswered = totalQuestions() - totalAttempted();
    var proceed = true;
    if(unanswered > 0){
      proceed = window.confirm(unanswered + ' question(s) are not answered yet. Submit anyway?');
    }
    if(!proceed) return;
    state.submitted = true;
    state.view = 'results';
    renderApp();
    window.scrollTo(0, 0);
  });
}

/* ============================================================
   RENDER: RESULTS SCREEN
   ============================================================ */
function scoreClassFor(correct, total){
  if(total === 0) return 'mid';
  var ratio = correct / total;
  if(ratio >= 0.7) return 'good';
  if(ratio >= 0.4) return 'mid';
  return 'bad';
}

function renderResultsHtml(){
  var score = computeScore();
  var total = totalQuestions();
  var breakdown = computeTopicBreakdown();

  var topicCardsHtml = ALL_TOPICS.map(function(t){
    var b = breakdown[t];
    var cls = scoreClassFor(b.correct, b.total);
    return '<div class="topic-card"><div class="tc-name">' + t + '</div>' +
      '<div class="tc-score ' + cls + '">' + b.correct + ' / ' + b.total + ' correct</div></div>';
  }).join('');

  var reviewHtml = '';
  SECTIONS.forEach(function(s){
    reviewHtml += '<div class="review-section-title">' + (s.num < 10 ? '0' + s.num : s.num) + '. ' + s.name + ' \u2014 Full Review</div>';
    var qs = questionsFor(s.num);
    var lastGroup = undefined;
    qs.forEach(function(q, idx){
      if(q.scenario_group_id && q.scenario_group_id !== lastGroup){
        reviewHtml += '<div class="scenario-block"><span class="sc-tag">Shared Scenario</span>' + real(q.scenario) + '</div>';
      }
      lastGroup = q.scenario_group_id || undefined;

      var chosen = state.answers[q.id];
      var verdict, verdictClass;
      if(chosen === undefined){ verdict = 'Not answered'; verdictClass = 'skipped'; }
      else if(chosen === q.correct_option_id){ verdict = 'Correct'; verdictClass = 'correct'; }
      else { verdict = 'Incorrect'; verdictClass = 'incorrect'; }

      var optsHtml = q.options.map(function(o){
        var cls = '';
        if(o.id === q.correct_option_id) cls = 'is-correct';
        else if(o.id === chosen) cls = 'is-wrong-chosen';
        var tag = '';
        if(o.id === q.correct_option_id) tag = ' \u2713 Correct answer';
        else if(o.id === chosen) tag = ' \u2717 Your answer';
        return '<div class="rc-option-line ' + cls + '">' + o.id + '. ' + real(o.text) + tag + '</div>';
      }).join('');

      reviewHtml +=
        '<div class="review-card">' +
          '<div class="rc-top">' +
            '<div><span class="rc-topic-tag">' + q.topic + '</span></div>' +
            '<span class="rc-verdict ' + verdictClass + '">' + verdict + '</span>' +
          '</div>' +
          '<div class="qnum">Q ' + (idx+1 < 10 ? '0' + (idx+1) : (idx+1)) + '.</div>' +
          '<div class="qtext">' + real(q.question) + '</div>' +
          optsHtml +
          '<div class="rc-explain"><b>Explanation:</b><br>' + real(q.explanation) + '</div>' +
        '</div>';
    });
  });

  return (
    '<div class="results-wrap">' +
      '<div class="score-card">' +
        '<div class="score-num">' + score + ' / ' + total + '</div>' +
        '<div class="score-label">Your Practice Score</div>' +
      '</div>' +
      '<div class="review-section-title" style="margin-top:0;">Topic-wise Breakdown</div>' +
      '<div class="topic-grid">' + topicCardsHtml + '</div>' +
      reviewHtml +
      '<div class="results-actions"><button class="btn secondary" id="retakeBtn">Retake Practice Set</button></div>' +
    '</div>'
  );
}

function wireResults(){
  document.getElementById('retakeBtn').addEventListener('click', function(){
    var ok = window.confirm('This will clear your answers and start over. Continue?');
    if(!ok) return;
    state.view = 'instructions';
    state.currentSection = 1;
    state.answers = {};
    state.submitted = false;
    renderApp();
    window.scrollTo(0, 0);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
safeLoad();
renderApp();

</script>
</body>
</html>
