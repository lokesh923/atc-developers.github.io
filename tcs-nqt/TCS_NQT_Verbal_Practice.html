<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCS NQT Verbal Ability Practice</title><style>:root{--navy:#1e2761;--blue:#2f66b3;--gold:#f9c74f;--bg:#eef1f8;--line:#d9deee;--ink:#1b2540;--mut:#5b6685;--ok:#0f7d6b;--bad:#be123c;--warn:#b45309}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:920px;margin:0 auto;padding:16px}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}.brand{font-weight:800;color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:700}.tabs button.on{background:var(--gold);color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 1px 3px #1e276112}
h1{margin:6px 0 4px;font-size:23px;color:var(--navy)}h2{margin:0 0 8px;font-size:18px;color:var(--navy)}h3{color:var(--navy);margin:12px 0 6px}
.tag{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;font-size:12px;border-radius:12px;padding:3px 11px;letter-spacing:.5px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-weight:700}.btn:hover{background:#2b3a86}.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn.gr{background:var(--ok)}.btn.rd{background:var(--bad)}.btn.sm{padding:6px 12px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;font-weight:600;font-size:13px;margin:8px 0 3px;color:var(--mut)}
select,input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:14px}.t th{background:var(--navy);color:#fff;text-align:left;padding:7px 10px}.t td{padding:6px 10px;border-bottom:1px solid var(--line)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.mut{color:var(--mut)}.sm{font-size:13px}
#shell2{display:flex;flex-direction:column;height:100vh}#mid{flex:1;display:flex;min-height:0}#qarea{flex:1;overflow:auto;padding:16px 22px;background:#fff}#side{width:240px;border-left:1px solid var(--line);background:#f8f9fd;overflow:auto;padding:10px}
#timer{font-size:20px;font-weight:800;background:#ffffff1f;border-radius:8px;padding:2px 12px;min-width:80px;text-align:center}#timer.low{background:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.pal button{height:34px;border-radius:6px;border:1px solid #aab3d1;background:#fff;font-weight:700;font-size:13px}.pal button.cur{outline:3px solid var(--gold)}.pal button.ans{background:var(--ok);color:#fff;border-color:var(--ok)}.pal button.nans{background:var(--bad);color:#fff;border-color:var(--bad)}.pal button.mark{background:#6d28d9;color:#fff}.pal button.markans{background:#6d28d9;color:#fff;box-shadow:inset 0 0 0 3px var(--ok)}
.legend{font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
#foot{background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}#foot .sp{flex:1}
.qno{font-weight:800;color:var(--navy)}.qtopic{float:right;font-size:12px;color:var(--mut)}.qtext{font-size:17px;margin:8px 0 12px;white-space:pre-wrap}.qtext img,.opt img{max-width:100%;height:auto;vertical-align:middle}.qtext img{cursor:zoom-in}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;background:#fff}.opt:hover{background:#f4f7ff}.opt.sel{border-color:var(--navy);background:#e8edff}.opt.right{border-color:var(--ok);background:#dcfce7}.opt.wrong{border-color:var(--bad);background:#fee2e2}.opt .k{font-weight:800;min-width:20px;color:var(--navy)}
.ansbox{width:100%;max-width:340px;padding:10px;border:2px solid var(--line);border-radius:8px;font-size:18px}
.fb{border-radius:10px;padding:10px 14px;margin-top:10px}.fb.g{background:#dcfce7;border:1px solid #86d6b7}.fb.r{background:#fee2e2;border:1px solid #f0b4b4}
.modal{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}.modal .box{background:#fff;border-radius:14px;padding:22px;max-width:520px;width:100%}
#lightbox{display:none;position:fixed;inset:0;background:#000b;z-index:60;align-items:center;justify-content:center;padding:20px}#lightbox img{max-width:96%;max-height:96%;background:#fff;border-radius:8px}
details.rev{margin:6px 0}details.rev summary{cursor:pointer;padding:4px 0}
@media(max-width:760px){#mid{flex-direction:column}#side{width:100%;border-left:0;border-top:1px solid var(--line);max-height:170px}.grid2,.grid3{grid-template-columns:1fr}}
textarea.big{width:100%;min-height:220px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--blue);width:100%}
.tc{display:inline-block;margin:2px;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;color:#fff}.tc.p{background:var(--ok)}.tc.f{background:var(--bad)}
.samp{background:#f4f6fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap;margin:4px 0}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tmr{font-size:30px;font-weight:800;color:var(--navy)}.big{font-size:40px;font-weight:900}
#shell2{display:flex;flex-direction:column;height:100vh}
</style></head><body><div id="app"></div><div id="lightbox" onclick="this.style.display='none'"><img id="lbimg"></div><script>window.VBANK={"sc":[{"id":"S30824","t":"Tenses","q":"By the time the audit team arrived, the accountant ___ all the files.","o":["was arrange","had arranged","has arranged","arranges"],"a":1,"e":"Two past events: the arranging happened before the team arrived, so past perfect: had arranged."},{"id":"S30825","t":"Subject-Verb Agreement","q":"The quality of the products ___ improved over the years.","o":["are","has","were","have"],"a":1,"e":"The real subject is 'quality' (singular), not 'products'. With 'over the years' the present perfect 'has improved' is correct."},{"id":"S30826","t":"Prepositions","q":"The manager is not satisfied ___ the progress of the project.","o":["at","to","of","with"],"a":3,"e":"The fixed phrase is 'satisfied with'."},{"id":"S30827","t":"Articles","q":"She gave me ___ useful piece of advice.","o":["the","no article","an","a"],"a":3,"e":"'Useful' begins with the sound 'yoo' (a consonant sound), so 'a' is used, not 'an'."},{"id":"S30828","t":"Vocabulary","q":"The CEO's ___ remarks angered the investors, who had expected an apology.","o":["dismissive","humble","gracious","sincere"],"a":0,"e":"The investors expected an apology and were angry, so the remarks must have been negative: dismissive."},{"id":"S30829","t":"Connectors","q":"The software was tested thoroughly; ___, a few bugs appeared after the release.","o":["however","hence","therefore","moreover"],"a":0,"e":"The second idea contrasts with the first (thorough testing vs bugs), so 'however'."},{"id":"S30830","t":"Conditionals","q":"If the team ___ the deadline, the client would have been satisfied.","o":["meets","would meet","met","had met"],"a":3,"e":"Third conditional: 'would have been' in the main clause needs 'had met' in the if-clause."},{"id":"S30831","t":"Pronouns","q":"The prize was shared between Ravi and ___.","o":["I","me","myself","mine"],"a":1,"e":"After the preposition 'between' use the object form: me."},{"id":"S30832","t":"Comparison","q":"Of the two proposals, the second is ___.","o":["best","more better","the best","better"],"a":3,"e":"Two things are compared, so the comparative 'better' is used; 'more better' is a double comparative."},{"id":"S30833","t":"Phrasal Verbs","q":"Please ___ the form carefully before signing it.","o":["look after","look for","look up to","look over"],"a":3,"e":"'Look over' means to examine. 'Look after' = care for, 'look for' = search, 'look up to' = admire."},{"id":"S30834","t":"Idioms","q":"After months of delay, the manager finally decided to ___ and launch the product.","o":["bite the bullet","spill the beans","miss the boat","break the ice"],"a":0,"e":"'Bite the bullet' means to face a difficult step bravely, which fits the sentence."},{"id":"S30835","t":"Gerunds","q":"She insisted on ___ the report herself.","o":["writing","written","to write","write"],"a":0,"e":"A verb after a preposition ('on') takes the -ing form: writing."},{"id":"S30836","t":"Word Forms","q":"The company's ___ in the rural market has grown steadily.","o":["presented","presently","present","presence"],"a":3,"e":"A noun is needed after 'company's': presence."},{"id":"S30837","t":"Confusing Words","q":"The new regulation will ___ small businesses the most.","o":["effect","infect","defect","affect"],"a":3,"e":"'Affect' is the verb meaning to influence; 'effect' is a noun (result)."},{"id":"S30838","t":"Parallel Structure","q":"The training programme aims to improve communication, build confidence and ___ teamwork.","o":["encouraging","encouraged","encourage","to encourage"],"a":2,"e":"The list must be parallel: improve, build, encourage (all verbs after 'aims to')."},{"id":"S30839","t":"Modals","q":"You ___ submit the form today; the deadline is next week.","o":["shouldn't","needn't","mustn't","can't"],"a":1,"e":"'Need not' means it is not necessary. 'Must not' would mean it is forbidden."},{"id":"S30840","t":"Future Perfect / Passive","q":"The bridge ___ by the end of next year.","o":["has completed","is completing","will complete","will have been completed"],"a":3,"e":"The bridge receives the action (passive) and the action finishes before a future time: will have been completed."},{"id":"S30841","t":"Agreement (Correlatives)","q":"Not only the manager but also the engineers ___ invited to the event.","o":["has been","were","was","is"],"a":1,"e":"With 'not only … but also' the verb agrees with the nearer subject, 'engineers' (plural): were."},{"id":"S30842","t":"Vocabulary (Meaning)","q":"The committee's decision was ___; it was supported by every member.","o":["arbitrary","unanimous","tentative","ambiguous"],"a":1,"e":"'Supported by every member' defines unanimous (agreed by all)."},{"id":"S30843","t":"Prepositions of Time","q":"The shop has been closed ___ Monday.","o":["for","from","since","by"],"a":2,"e":"'Since' is used with a point in time (Monday) and the present perfect."},{"id":"S30844","t":"Tenses","q":"The train ___ before we reached the platform.","o":["had left","has left","leaves","was leave"],"a":0,"e":"Earlier of two past events takes past perfect: had left."},{"id":"S30845","t":"Tenses","q":"She ___ for the interview since morning.","o":["prepares","is preparing","has been preparing","prepared"],"a":2,"e":"'Since morning' with an action still going on: present perfect continuous."},{"id":"S30846","t":"Tenses","q":"By next December, they ___ the new office.","o":["will complete","will have completed","have completed","complete"],"a":1,"e":"Action finished before a future time: future perfect."},{"id":"S30847","t":"Tenses","q":"I ___ him at the station when the announcement was made.","o":["met","was meeting","have met","meet"],"a":1,"e":"An action in progress at a past moment: past continuous."},{"id":"S30848","t":"Tenses","q":"If you ___ the bell, someone will open the door.","o":["will ring","ring","rang","would ring"],"a":1,"e":"After 'if' in a future condition use the simple present."},{"id":"S30849","t":"Tenses","q":"The teacher said that honesty ___ the best policy.","o":["was","is","had been","would be"],"a":1,"e":"A universal truth stays in the simple present."},{"id":"S30850","t":"Tenses","q":"He ___ here for ten years before he moved to Delhi.","o":["worked","had worked","has worked","works"],"a":1,"e":"Action completed before another past action: past perfect."},{"id":"S30851","t":"Tenses","q":"Look! The children ___ in the garden.","o":["play","played","are playing","have played"],"a":2,"e":"'Look!' signals something happening now: present continuous."},{"id":"S30852","t":"Tenses","q":"I ___ this film twice already.","o":["saw","have seen","had seen","see"],"a":1,"e":"'Already' with a link to the present: present perfect."},{"id":"S30853","t":"Tenses","q":"She ___ to Mumbai last year.","o":["moved","has moved","had moved","moves"],"a":0,"e":"'Last year' fixes a finished time: simple past."},{"id":"S30854","t":"Agreement","q":"Each of the candidates ___ a separate form.","o":["have","has","are","were"],"a":1,"e":"'Each of' takes a singular verb."},{"id":"S30855","t":"Agreement","q":"The boss, together with his staff, ___ present at the event.","o":["were","are","was","have been"],"a":2,"e":"The verb agrees with 'boss' (singular)."},{"id":"S30856","t":"Agreement","q":"Neither the clerk nor the officers ___ aware of the rule.","o":["is","was","are","has"],"a":2,"e":"Verb agrees with the nearer subject 'officers' (plural)."},{"id":"S30857","t":"Agreement","q":"Economics ___ a popular subject among students.","o":["are","is","were","have been"],"a":1,"e":"Names of subjects ending in -ics are singular."},{"id":"S30858","t":"Agreement","q":"A number of employees ___ absent today.","o":["is","was","are","has been"],"a":2,"e":"'A number of' + plural noun takes a plural verb."},{"id":"S30859","t":"Agreement","q":"The number of vacancies ___ limited.","o":["are","is","were","have been"],"a":1,"e":"'The number of' takes a singular verb."},{"id":"S30860","t":"Agreement","q":"Bread and butter ___ my usual breakfast.","o":["are","is","were","have been"],"a":1,"e":"Two words forming one idea take a singular verb."},{"id":"S30861","t":"Agreement","q":"Either you or he ___ responsible for this.","o":["are","is","am","were"],"a":1,"e":"Verb agrees with the nearer subject 'he'."},{"id":"S30862","t":"Agreement","q":"The furniture in these rooms ___ very old.","o":["are","is","were","have been"],"a":1,"e":"'Furniture' is uncountable and singular."},{"id":"S30863","t":"Agreement","q":"The police ___ searching for the missing child.","o":["is","are","was","has been"],"a":1,"e":"'Police' is a plural noun."},{"id":"S30864","t":"Articles","q":"He is ___ M.B.A. from a reputed institute.","o":["a","an","the","no article"],"a":1,"e":"'M.B.A.' begins with the vowel sound 'em'."},{"id":"S30865","t":"Articles","q":"Mumbai is ___ largest city in the country.","o":["a","an","the","no article"],"a":2,"e":"A superlative takes 'the'."},{"id":"S30866","t":"Articles","q":"She wants to become ___ engineer.","o":["a","an","the","no article"],"a":1,"e":"'Engineer' begins with a vowel sound."},{"id":"S30867","t":"Articles","q":"___ gold is a precious metal.","o":["A","An","The","No article"],"a":3,"e":"A material used in general takes no article."},{"id":"S30868","t":"Articles","q":"He returned after ___ hour.","o":["a","an","the","no article"],"a":1,"e":"'Hour' starts with a silent h, so a vowel sound."},{"id":"S30869","t":"Prepositions","q":"The meeting is scheduled ___ 3 pm.","o":["in","on","at","by"],"a":2,"e":"Clock time takes 'at'."},{"id":"S30870","t":"Prepositions","q":"She was born ___ 1999.","o":["on","at","in","by"],"a":2,"e":"Years take 'in'."},{"id":"S30871","t":"Prepositions","q":"He is very good ___ solving puzzles.","o":["in","at","on","with"],"a":1,"e":"Fixed phrase: good at."},{"id":"S30872","t":"Prepositions","q":"The company is looking ___ new graduates.","o":["for","at","after","into"],"a":0,"e":"'Look for' means search."},{"id":"S30873","t":"Prepositions","q":"He congratulated me ___ my success.","o":["for","on","at","with"],"a":1,"e":"Fixed phrase: congratulate someone on."},{"id":"S30874","t":"Prepositions","q":"The bridge is ___ construction.","o":["in","under","on","at"],"a":1,"e":"Fixed phrase: under construction."},{"id":"S30875","t":"Prepositions","q":"He has been absent ___ Monday.","o":["for","from","since","by"],"a":2,"e":"'Since' goes with a point of time."},{"id":"S30876","t":"Prepositions","q":"The cat jumped ___ the wall.","o":["over","between","among","beside"],"a":0,"e":"Movement across the top of the wall: over."},{"id":"S30877","t":"Prepositions","q":"She is addicted ___ online games.","o":["for","to","with","at"],"a":1,"e":"Fixed phrase: addicted to."},{"id":"S30878","t":"Prepositions","q":"The parcel will reach you ___ three days.","o":["within","since","for","by"],"a":0,"e":"'Within' means not later than the end of the period."},{"id":"S30879","t":"Pronouns","q":"Between you and ___, this plan will not work.","o":["I","me","myself","mine"],"a":1,"e":"After a preposition use the object form."},{"id":"S30880","t":"Pronouns","q":"He blamed ___ for the mistake.","o":["him","himself","his","he"],"a":1,"e":"Subject and object are the same person: reflexive."},{"id":"S30881","t":"Pronouns","q":"The man ___ called you is my uncle.","o":["whom","which","who","whose"],"a":2,"e":"'Who' is the subject of 'called'."},{"id":"S30882","t":"Pronouns","q":"Is this the book ___ you were looking for?","o":["that","who","whom","whose"],"a":0,"e":"'That' refers to a thing in a restrictive clause."},{"id":"S30883","t":"Pronouns","q":"I do not know ___ umbrella this is.","o":["who","whom","whose","which"],"a":2,"e":"Possession is shown by 'whose'."},{"id":"S30884","t":"Connectors","q":"He worked hard; ___, he did not get promoted.","o":["therefore","moreover","nevertheless","because"],"a":2,"e":"The result contrasts with the effort: nevertheless."},{"id":"S30885","t":"Connectors","q":"___ he is rich, he is humble.","o":["Because","Although","Unless","Since"],"a":1,"e":"Contrast: rich but humble."},{"id":"S30886","t":"Connectors","q":"We stayed indoors ___ it was raining.","o":["although","because","unless","but"],"a":1,"e":"Reason: because."},{"id":"S30887","t":"Connectors","q":"Hurry up, ___ you will miss the bus.","o":["and","but","or","so"],"a":2,"e":"'Or' shows the alternative result: otherwise."},{"id":"S30888","t":"Connectors","q":"He did not come ___ he was ill.","o":["because","though","unless","so that"],"a":0,"e":"Reason: because he was ill."},{"id":"S30889","t":"Connectors","q":"Work hard ___ you should fail.","o":["lest","unless","until","though"],"a":0,"e":"'Lest … should' expresses fear of a result."},{"id":"S30890","t":"Connectors","q":"She is intelligent ___ hardworking.","o":["but","and","or","yet"],"a":1,"e":"Both qualities are added: and."},{"id":"S30891","t":"Connectors","q":"I will wait here ___ you return.","o":["until","unless","although","because"],"a":0,"e":"'Until' marks the time limit."},{"id":"S30892","t":"Conditionals","q":"If I had known the answer, I ___ you.","o":["would tell","would have told","will tell","told"],"a":1,"e":"Third conditional: would have + V3."},{"id":"S30893","t":"Conditionals","q":"If she ___ here, she would help us.","o":["is","were","will be","has been"],"a":1,"e":"Second conditional: if + were."},{"id":"S30894","t":"Conditionals","q":"___ you need help, call me.","o":["Should","Would","Did","Might"],"a":0,"e":"'Should you need' replaces 'if you should need'."},{"id":"S30895","t":"Conditionals","q":"I wish I ___ a car.","o":["have","had","will have","would have"],"a":1,"e":"A present wish takes the past form."},{"id":"S30896","t":"Conditionals","q":"Unless you ___, you will not succeed.","o":["work","do not work","worked","will work"],"a":0,"e":"'Unless' already has a negative meaning."},{"id":"S30897","t":"Conditionals","q":"She talks as if she ___ everything.","o":["know","knew","knows","has known"],"a":1,"e":"'As if' for an unreal situation takes the past."},{"id":"S30898","t":"Comparison","q":"This is the ___ day of my life.","o":["happy","happier","happiest","more happy"],"a":2,"e":"'The … of my life' needs a superlative."},{"id":"S30899","t":"Comparison","q":"He is ___ than his brother.","o":["more intelligent","most intelligent","intelligenter","very intelligent"],"a":0,"e":"'Than' needs the comparative; intelligent is a long adjective."},{"id":"S30900","t":"Comparison","q":"Gold is ___ than silver.","o":["more costly","costliest","most costly","costly"],"a":0,"e":"'Than' needs the comparative."},{"id":"S30901","t":"Comparison","q":"Of all the players, she is the ___.","o":["better","good","best","more good"],"a":2,"e":"'Of all' needs a superlative."},{"id":"S30902","t":"Comparison","q":"This road is ___ than that one.","o":["wide","wider","widest","more wide"],"a":1,"e":"Short adjective + -er before 'than'."},{"id":"S30903","t":"Comparison","q":"He is senior ___ me in the company.","o":["than","to","from","of"],"a":1,"e":"'Senior' takes 'to'."},{"id":"S30904","t":"Voice","q":"The report ___ by the manager yesterday.","o":["was submitted","is submitted","submitted","has submitted"],"a":0,"e":"Passive in the simple past: was submitted."},{"id":"S30905","t":"Voice","q":"The new software ___ next month.","o":["launches","will be launched","has launched","is launching by"],"a":1,"e":"Passive future: will be launched."},{"id":"S30906","t":"Voice","q":"The thief ___ by the police.","o":["caught","was caught","has caught","is catching"],"a":1,"e":"Passive: the thief received the action."},{"id":"S30907","t":"Voice","q":"Active form of 'The letter was written by Ravi':","o":["Ravi writes the letter.","Ravi wrote the letter.","Ravi has written the letter.","Ravi was writing the letter."],"a":1,"e":"The passive past 'was written' becomes simple past 'wrote'."},{"id":"S30908","t":"Speech","q":"She said, 'I am busy.' → She said that she ___ busy.","o":["is","was","had been","will be"],"a":1,"e":"Present tense steps back to past."},{"id":"S30909","t":"Speech","q":"He asked, 'Where do you live?' → He asked me where I ___.","o":["live","lived","do live","am living"],"a":1,"e":"Reported question: statement order and past tense."},{"id":"S30910","t":"Gerund","q":"He avoided ___ the question.","o":["to answer","answering","answer","answered"],"a":1,"e":"'Avoid' is followed by the -ing form."},{"id":"S30911","t":"Gerund","q":"She decided ___ abroad for higher studies.","o":["going","to go","go","gone"],"a":1,"e":"'Decide' takes the to-infinitive."},{"id":"S30912","t":"Gerund","q":"I look forward to ___ you.","o":["meet","meeting","met","have met"],"a":1,"e":"'Look forward to' takes the -ing form."},{"id":"S30913","t":"Gerund","q":"It is no use ___ over spilt milk.","o":["to cry","crying","cry","cried"],"a":1,"e":"'It is no use' takes the -ing form."},{"id":"S30914","t":"Modals","q":"You ___ wear a seat belt while driving; it is the law.","o":["can","must","may","might"],"a":1,"e":"Strong obligation: must."},{"id":"S30915","t":"Modals","q":"___ I use your phone for a minute?","o":["May","Must","Shall to","Will to"],"a":0,"e":"Polite request for permission: may."},{"id":"S30916","t":"Modals","q":"He ___ be at home; his lights are on.","o":["must","need","dare","ought"],"a":0,"e":"Strong deduction: must."},{"id":"S30917","t":"Modals","q":"You ___ better consult a doctor.","o":["would","had","should","have"],"a":1,"e":"'Had better' gives advice."},{"id":"S30918","t":"Vocabulary","q":"The manager's ___ attitude helped solve the dispute quickly.","o":["rigid","flexible","hostile","careless"],"a":1,"e":"Quick solution suggests a positive word: flexible."},{"id":"S30919","t":"Vocabulary","q":"The lecture was so ___ that many students fell asleep.","o":["engaging","tedious","thrilling","lively"],"a":1,"e":"Students falling asleep suggests boring: tedious."},{"id":"S30920","t":"Vocabulary","q":"Choose the synonym of 'diligent'.","o":["lazy","hardworking","careless","clever"],"a":1,"e":"Diligent means hardworking."},{"id":"S30921","t":"Vocabulary","q":"Choose the antonym of 'generous'.","o":["kind","stingy","polite","wealthy"],"a":1,"e":"Opposite of generous: stingy."},{"id":"S30922","t":"Vocabulary","q":"The company decided to ___ the old policy.","o":["abolish","abolition","abolished","abolishing"],"a":0,"e":"After 'to' use the base verb."},{"id":"S30923","t":"Vocabulary","q":"Choose the synonym of 'reluctant'.","o":["willing","unwilling","eager","ready"],"a":1,"e":"Reluctant means unwilling."},{"id":"S30924","t":"Vocabulary","q":"His ___ behaviour surprised everyone, as he was usually calm.","o":["erratic","steady","calm","predictable"],"a":0,"e":"Surprising change from calm: erratic (unpredictable)."},{"id":"S30925","t":"Vocabulary","q":"Choose the antonym of 'ancient'.","o":["modern","old","historic","antique"],"a":0,"e":"Opposite of ancient: modern."},{"id":"S30926","t":"Vocabulary","q":"The scientist's ___ led to a major breakthrough.","o":["persistence","persistent","persist","persistently"],"a":0,"e":"A noun is needed after 'scientist's'."},{"id":"S30927","t":"Vocabulary","q":"The new law will ___ child labour.","o":["eradicate","erode","evade","elude"],"a":0,"e":"Eradicate means to remove completely."},{"id":"S30928","t":"Confusing words","q":"The ___ of the school addressed the students.","o":["principal","principle","prince","principality"],"a":0,"e":"Principal = head of a school."},{"id":"S30929","t":"Confusing words","q":"Please give me your ___ on this matter.","o":["advise","advice","advices","advisory"],"a":1,"e":"A noun is needed: advice."},{"id":"S30930","t":"Confusing words","q":"Heavy rain had a bad ___ on the crops.","o":["affect","effect","defect","infect"],"a":1,"e":"A noun is needed after 'a bad': effect."},{"id":"S30931","t":"Idioms","q":"The new manager decided to ___ and discuss the real problem.","o":["beat about the bush","get to the point","pull my leg","cry over spilt milk"],"a":1,"e":"The sentence wants a direct approach."},{"id":"S30932","t":"Idioms","q":"He is always ___ about his success, so nobody likes talking to him.","o":["blowing his own trumpet","hitting the sack","under the weather","on cloud nine"],"a":0,"e":"Boasting: blow one's own trumpet."},{"id":"S30933","t":"Idioms","q":"The plan fell ___ because of lack of funds.","o":["through","over","off","down on"],"a":0,"e":"'Fall through' means fail."},{"id":"S30934","t":"Idioms","q":"I'm sorry, I cannot ___ his rude behaviour any longer.","o":["put up with","put off","put on","put out"],"a":0,"e":"'Put up with' means tolerate."},{"id":"S30935","t":"Idioms","q":"After the long delay, the project finally got the green ___.","o":["light","signal","paper","flag"],"a":0,"e":"'Get the green light' means receive permission."},{"id":"S30936","t":"Idioms","q":"The team worked day and night to ___ the deadline.","o":["meet","match","fit","touch"],"a":0,"e":"Collocation: meet a deadline."},{"id":"S30937","t":"Parallelism","q":"She likes swimming, cycling and ___.","o":["to run","running","runs","ran"],"a":1,"e":"Items in a list must have the same form."},{"id":"S30938","t":"Parallelism","q":"The job requires patience, creativity and ___.","o":["to be accurate","accurate","accuracy","accurately"],"a":2,"e":"Parallel nouns: patience, creativity, accuracy."},{"id":"S30939","t":"Parallelism","q":"He is not only intelligent but also ___.","o":["hard working","works hard","he works hard","working hard"],"a":0,"e":"Parallel adjectives after 'not only … but also'."},{"id":"S30940","t":"Word form","q":"The ___ of the project depends on teamwork.","o":["succeed","success","successful","successfully"],"a":1,"e":"A noun is needed after 'The'."},{"id":"S30941","t":"Word form","q":"She spoke ___ about her plans.","o":["enthusiasm","enthusiastic","enthusiastically","enthuse"],"a":2,"e":"An adverb describes the verb 'spoke'."},{"id":"S30942","t":"Word form","q":"It was a ___ decision that saved the company.","o":["wise","wisely","wisdom","wiseness"],"a":0,"e":"An adjective is needed before 'decision'."},{"id":"S30943","t":"Word form","q":"The ___ between the two answers is very small.","o":["different","differ","difference","differently"],"a":2,"e":"A noun is needed after 'The'."}],"pr":[{"id":"PR01","title":"Electric scooter plant","p":"Veltrix Motors announced on 9 March that it will build a new assembly plant in Coimbatore at a cost of ₹850 crore. The plant is expected to begin production in January 2027 and will make 60,000 electric scooters a year. About 2,400 people will be employed, and 70 percent of the jobs are reserved for local residents. The company will also set up a training centre, which will teach 500 students every year. The chairman, Mrs Lata Menon, said that the plant will run on solar power for at least 40 percent of its needs, and that the second phase, planned for 2029, will double the output.","m":"Veltrix Motors announced on 9 March a new plant in Coimbatore costing ₹850 crore. Production starts in January 2027 with 60,000 electric scooters a year. It will employ 2,400 people, 70 percent of the jobs for locals, and have a training centre for 500 students every year. Chairman Mrs Lata Menon said at least 40 percent of the power will be solar and the second phase in 2029 will double output.","facts":[["veltrix"],["9 march","march 9","9th march"],["coimbatore"],["850 crore","850 cr"],["january 2027","jan 2027"],["60000","60 000"],["2400"],["70 percent","70%"],["500 students","500 student"],["lata menon","menon"],["40 percent","40%"],["2029"],["double"]]},{"id":"PR02","title":"Metro pass rules","p":"The Metro Authority has revised the monthly pass rules from 1 April. Students below 25 now get a 30 percent discount on the ₹1,200 pass, while senior citizens above 60 get 50 percent. Passes must be renewed within 5 days of expiry, otherwise a ₹100 penalty applies. Smart cards cost ₹150, of which ₹50 is non-refundable. A lost card must be reported within 48 hours to the helpline 1800-22-0099, and a duplicate card is issued within 7 working days. Student passes are valid only on weekdays, but passes for senior citizens are valid on all days.","m":"From 1 April the ₹1,200 monthly pass gives students below 25 a 30 percent discount and senior citizens above 60 a 50 percent discount. Renewal is within 5 days of expiry or a ₹100 penalty applies. Smart cards cost ₹150 and ₹50 is non-refundable. Lost cards must be reported within 48 hours on 1800-22-0099 and a duplicate comes in 7 working days. Student passes work on weekdays only; senior passes on all days.","facts":[["1 april","april 1"],["1200"],["below 25","under 25","25"],["30 percent","30%"],["60"],["50 percent","50%"],["5 days"],["100 penalty","rs 100","penalty of rs100","100"],["150"],["50 non","rs 50","50 is non","non-refundable","non refundable"],["48 hours","48 hrs"],["1800-22-0099","1800220099","1800 22 0099"],["7 working days","7 days"],["weekdays","week days"]]},{"id":"PR03","title":"Water survey","p":"On 12 June, Dr Ishita Banerjee led a team of 14 researchers to a village in Odisha to study a rise in water-borne diseases. Over six days, they tested 96 water samples from 18 wells and found that 31 samples contained harmful bacteria. The main cause was a broken sewage pipe 40 metres from the largest well. The team advised the village council to repair the pipe within 10 days, chlorinate all wells every month and build two new hand pumps. The council agreed and approved ₹7.5 lakh for the work.","m":"On 12 June Dr Ishita Banerjee led 14 researchers to an Odisha village to study water-borne diseases. In six days they tested 96 samples from 18 wells and 31 had harmful bacteria, mainly from a broken sewage pipe 40 metres from the largest well. They advised the council to repair the pipe within 10 days, chlorinate the wells every month and build two hand pumps. The council approved ₹7.5 lakh.","facts":[["12 june","june 12"],["ishita banerjee","banerjee","ishita"],["14 researchers","14 members","team of 14","14"],["odisha"],["six days","6 days"],["96"],["18 wells","18"],["31"],["sewage pipe","sewage"],["40 metres","40 meters","40 m"],["largest well","biggest well"],["10 days"],["every month","monthly"],["two","2 hand pumps","2 new"],["7.5 lakh","75 lakh","7.5"]]},{"id":"PR04","title":"Coding contest","p":"To register for the annual coding contest, a participant must first create an account on the portal using a college email. Registration opens on 3 October at 10 am and closes on 20 October at 5 pm. Teams may have two or three members, and each team must pick a unique name of at most 20 characters. The fee is ₹300 per team, payable only by UPI. The first round is a 90-minute online test on 26 October, and the top 40 teams go to the final on 9 November in Hyderabad, where the winners receive ₹60,000 and the runners-up ₹35,000.","m":"Participants create a portal account with a college email. Registration opens on 3 October at 10 am and closes on 20 October at 5 pm. Teams have two or three members and a unique name of at most 20 characters. The fee is ₹300 per team, UPI only. The first round is a 90-minute online test on 26 October. The top 40 teams play the final on 9 November in Hyderabad; winners get ₹60,000 and runners-up ₹35,000.","facts":[["college email","college mail"],["3 october","october 3"],["10 am","10am","10 a.m"],["20 october","october 20"],["5 pm","5pm","5 p.m"],["two or three","2 or 3","two to three"],["20 characters"],["300"],["upi"],["90","90 minute","90-minute"],["26 october","october 26"],["40 teams","top 40","40"],["9 november","november 9"],["hyderabad"],["60000","60 000"],["35000","35 000"]]},{"id":"PR05","title":"Hospital expansion","p":"St Anne's Hospital in Mysuru will open a new cancer wing on 4 February after three years of construction costing ₹210 crore. The wing has 120 beds, 6 operation theatres and a radiation unit that can treat 150 patients a day. Treatment for patients from families earning less than ₹3 lakh a year will be free. The hospital director, Dr Farid Qureshi, said that 45 new doctors and 200 nurses will be hired by April, and that a helpline, 0821-555-0147, will be open from 8 am to 8 pm.","m":"St Anne's Hospital in Mysuru opens a new cancer wing on 4 February, built over three years for ₹210 crore. It has 120 beds, 6 operation theatres and a radiation unit treating 150 patients a day. Families earning below ₹3 lakh a year get free treatment. Director Dr Farid Qureshi said 45 doctors and 200 nurses will be hired by April and a helpline, 0821-555-0147, will run 8 am to 8 pm.","facts":[["st anne"],["mysuru","mysore"],["4 february","february 4"],["three years","3 years"],["210 crore","210"],["120 beds","120"],["6 operation","six operation","6 theatres","six theatres","6"],["radiation"],["150 patients","150"],["3 lakh","three lakh"],["free"],["farid qureshi","qureshi"],["45"],["200 nurses","200"],["april"],["0821-555-0147","08215550147","0821 555 0147"],["8 am","8am"],["8 pm","8pm"]]},{"id":"PR06","title":"Airline schedule change","p":"Skyline Air has changed its Pune–Delhi service from 1 November. Flight SK 214 will now leave at 6:45 am instead of 7:30 am and land at 8:50 am. The evening flight SK 217 is cancelled, and passengers can move to SK 219 at 9:10 pm without any charge. Check-in closes 45 minutes before departure for all flights. Cabin baggage is limited to 7 kg, and checked baggage to 15 kg, with ₹400 charged for every extra kilogram.","m":"From 1 November Skyline Air flight SK 214 from Pune to Delhi leaves at 6:45 am instead of 7:30 am and lands at 8:50 am. SK 217 is cancelled and passengers can shift to SK 219 at 9:10 pm free of charge. Check-in closes 45 minutes before departure. Cabin baggage is 7 kg, checked baggage 15 kg, and each extra kilogram costs ₹400.","facts":[["skyline"],["pune"],["delhi"],["1 november","november 1"],["sk 214","sk214","214"],["6:45","645"],["7:30","730"],["8:50","850"],["sk 217","sk217","217"],["cancel"],["sk 219","sk219","219"],["9:10","910"],["45 minutes","45 min"],["7 kg","7kg"],["15 kg","15kg"],["400"]]},{"id":"PR07","title":"School sports day","p":"The annual sports day of Lotus Public School will be held on 18 January at the municipal stadium. Over 900 students from classes 6 to 12 will compete in 14 events, including relay races, long jump and a 1,500-metre run. Four houses, Red, Blue, Green and Yellow, will score points, with 5 points for first place, 3 for second and 1 for third. The chief guest will be the Olympic archer Meera Joshi, and the prize distribution is planned for 4:30 pm.","m":"Lotus Public School's annual sports day is on 18 January at the municipal stadium. More than 900 students from classes 6 to 12 will take part in 14 events, such as relays, long jump and a 1,500-metre run. The four houses Red, Blue, Green and Yellow score 5, 3 and 1 points for first, second and third place. Olympic archer Meera Joshi is the chief guest and prizes are at 4:30 pm.","facts":[["lotus"],["18 january","january 18"],["municipal stadium","municipal"],["900"],["6 to 12","6-12","6 and 12","class 6","classes 6"],["14 events","14"],["relay"],["long jump"],["1500","1 500"],["four houses","4 houses","red"],["5 points","5"],["3 for second","3","second"],["1 for third","third"],["meera joshi","joshi"],["archer"],["4:30","430"]]},{"id":"PR08","title":"Bank scheme","p":"Union Prime Bank launched a new savings scheme called Gold Saver on 2 July. Customers who keep a minimum balance of ₹10,000 earn 6.5 percent interest a year, which is 1 percent higher than the regular rate. Senior citizens get an extra 0.5 percent. Withdrawals are limited to 4 per month, and a fee of ₹50 applies to each additional withdrawal. The scheme is open only till 30 September and is available in 220 branches across 9 states.","m":"Union Prime Bank launched the Gold Saver savings scheme on 2 July. With a minimum balance of ₹10,000 customers earn 6.5 percent a year, 1 percent above the regular rate, and senior citizens get an extra 0.5 percent. Only 4 withdrawals a month are allowed, then ₹50 for each extra one. The scheme is open until 30 September in 220 branches across 9 states.","facts":[["union prime"],["gold saver"],["2 july","july 2"],["10000","10 000"],["6.5"],["1 percent","1%","one percent"],["0.5","half percent"],["senior"],["4 per month","4 a month","4 withdrawals","four"],["50"],["30 september","september 30"],["220"],["9 states","nine states"]]}],"em":[{"id":"EM01","title":"Leave request","sc":"You are Aman Verma, a software trainee. You need leave on 18 and 19 September to attend your sister’s wedding in Jaipur. Your work is up to date and your teammate Isha Rao will handle your tasks. Write an email to your manager, Mr Kulkarni.","model":"Subject: Leave Request for 18 and 19 September\n\nDear Mr Kulkarni,\n\nI am writing to request leave on 18 and 19 September to attend my sister’s wedding in Jaipur. All my current tasks are up to date, and my teammate Isha Rao has agreed to handle any urgent work during my absence. I will be available by phone in case of an emergency. I would be grateful if you could approve my request.\n\nThank you for your consideration.\n\nYours sincerely,\nAman Verma","facts":["18","19","Aman","Isha","Jaipur","Kulkarni","Rao"]},{"id":"EM02","title":"Complaint","sc":"You are Sneha Kapoor. You ordered a laptop bag (order number 7305) on 2 October with a promised delivery in four days. It has not arrived after nine days. Write an email to the customer support team asking for delivery within two working days or a refund.","model":"Subject: Delayed Delivery of Order 7305\n\nDear Customer Support Team,\n\nI placed order number 7305 for a laptop bag on 2 October, and it was promised within four days. Nine days have passed and I have not received it. Please arrange delivery within two working days; otherwise, I request a full refund. I would also appreciate a written update on the status of my order.\n\nI look forward to your prompt reply.\n\nRegards,\nSneha Kapoor","facts":["2","7305","Kapoor","October","Sneha"]},{"id":"EM03","title":"Meeting follow-up","sc":"You are Karan Mehta, a project lead. After today’s meeting, three actions were agreed: Pooja will send the test plan by Tuesday, Imran will fix the login bug by Thursday, and you will update the client on Friday. Write a follow-up email to the team.","model":"Subject: Action Items from Today’s Project Meeting\n\nDear Team,\n\nThank you for attending today’s meeting. I would like to confirm the action items we agreed on. Pooja will send the test plan by Tuesday, Imran will fix the login bug by Thursday, and I will update the client on Friday. Please let me know if any deadline needs to change.\n\nThank you for your support.\n\nBest regards,\nKaran Mehta","facts":["Friday","Imran","Karan","Mehta","Pooja","Thursday","Tuesday"]},{"id":"EM04","title":"Request for information","sc":"You are Diya Nair, a final-year student. You want to know the fee, the duration and the last date of registration for the 3-month Cloud Computing course at Nova Institute. Write an email to the admissions office.","model":"Subject: Request for Details of the Cloud Computing Course\n\nDear Admissions Team,\n\nI am a final-year engineering student and I am interested in your three-month Cloud Computing course. Could you please share the course fee, the duration and schedule of classes, and the last date of registration? I would also like to know whether a certificate is provided on completion.\n\nThank you for your time.\n\nSincerely,\nDiya Nair","facts":["3","Cloud","Computing","Diya","Nair"]},{"id":"EM05","title":"Apology for delay","sc":"You are Rahul Sen. You missed the Monday deadline for a budget summary because the finance data was corrected late. You will send it by Thursday 11 a.m. Write an email to your manager, Ms Fernandes.","model":"Subject: Apology for Delay in the Budget Summary\n\nDear Ms Fernandes,\n\nI apologise for missing Monday’s deadline for the budget summary. The delay was caused by late corrections in the finance data, which needed extra verification. I will submit the completed summary by Thursday, 11 a.m. I will share my progress earlier in future so that such delays do not occur again.\n\nThank you for your understanding.\n\nYours sincerely,\nRahul Sen","facts":["11","Fernandes","Monday","Rahul","Sen","Thursday"]},{"id":"EM06","title":"Job application","sc":"You are Meghna Iyer, a recent B.Sc. Computer Science graduate. You are applying for the Data Analyst Trainee post at Orion Analytics. You know Python and Excel and have completed a sales-dashboard project. Your resume is attached. Write an email to the hiring manager.","model":"Subject: Application for the Data Analyst Trainee Position\n\nDear Hiring Manager,\n\nI am writing to apply for the Data Analyst Trainee position at Orion Analytics. I have recently completed my B.Sc. in Computer Science and have worked with Python and Excel. I built a sales-dashboard project that helped me understand data cleaning and reporting. I have attached my resume and would welcome the opportunity to discuss my application.\n\nThank you for considering my application.\n\nYours faithfully,\nMeghna Iyer","facts":["Analyst","Analytics","Data","Excel","Iyer","Meghna","Orion"]},{"id":"EM07","title":"Payment reminder","sc":"You are Farhan Ali from an accounts team. Invoice 2290 for ₹36,000 was due on 10 November and is still unpaid. Write a polite reminder to the client, Mr Desai, and attach the invoice.","model":"Subject: Reminder: Payment of Invoice 2290\n\nDear Mr Desai,\n\nThis is a gentle reminder that payment of invoice 2290, amounting to ₹36,000, was due on 10 November and has not yet been received. I have attached a copy of the invoice for your convenience. If you have already made the payment, please ignore this message. Kindly let me know if you need any clarification.\n\nThank you for your cooperation.\n\nKind regards,\nFarhan Ali","facts":["10","2290","36,000","Ali","Desai","Farhan","November"]},{"id":"EM08","title":"Thank-you after training","sc":"You are Tanya Shah. A trainer, Mr Bose, conducted a two-hour session on presentation skills yesterday. Thank him, mention one thing you found useful, and suggest a follow-up session for the team.","model":"Subject: Thank You for the Presentation Skills Session\n\nDear Mr Bose,\n\nThank you for conducting the session on presentation skills yesterday. The practical exercises on structuring slides were very useful, and I have already started using the tips in my work. I would like to suggest a follow-up session for the whole team so that everyone can practise further. Please accept my sincere thanks for your time and effort.\n\nWarm regards,\nTanya Shah","facts":["Bose","Shah","Tanya"]},{"id":"EM09","title":"Request for extension","sc":"You are Nikhil Rao, an intern. Your project report is due on 25 October, but your guide, Dr Sinha, is travelling and has not reviewed your draft. Request a three-day extension to 28 October from your mentor, Ms Chawla.","model":"Subject: Request for Extension of Report Deadline\n\nDear Ms Chawla,\n\nI am writing to request a three-day extension for my project report, which is due on 25 October. My guide, Dr Sinha, is travelling and has not yet been able to review my draft. With his feedback I can improve the report, and I would be able to submit it by 28 October. I apologise for any inconvenience and would be grateful for your approval.\n\nThank you for your understanding.\n\nYours sincerely,\nNikhil Rao","facts":["25","28","Chawla","Nikhil","October","Rao","Sinha"]},{"id":"EM10","title":"Technical issue report","sc":"You are Zoya Khan, an employee. Since Tuesday morning the office VPN disconnects every 10 minutes, and it has affected your client calls. Report the issue to the IT helpdesk, give the facts, and ask for a fix by Friday.","model":"Subject: Frequent VPN Disconnections Since Tuesday\n\nDear IT Helpdesk,\n\nI am writing to report a problem with the office VPN. Since Tuesday morning, the connection disconnects every ten minutes, and this has interrupted my client calls and delayed my work. I have restarted my laptop and reconnected several times, but the problem continues. Kindly look into this issue and resolve it by Friday. Please let me know if you need any further details from me.\n\nThank you for your support.\n\nRegards,\nZoya Khan","facts":["10","Friday","Khan","Tuesday","Zoya"]}]};</script>
<script>/* Unlimited sentence-completion generator (grammar + vocabulary), correct by construction */
(function(G){
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[ri(0,a.length-1)],shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const F=[],add=(id,t,gen)=>F.push({id,t,gen});
const mk=(t,stem,ok,wrong,e)=>{const o=[ok];wrong.forEach(w=>{if(w!==ok&&!o.includes(w))o.push(w)});if(o.length<4)return null;const opts=shuffle(o.slice(0,4));return {t,ty:'mcq',q:stem,o:opts,a:opts.indexOf(ok),e}};
const s3=v=>/(s|sh|ch|x|z|o)$/.test(v)?v+'es':/[^aeiou]y$/.test(v)?v.slice(0,-1)+'ies':v+'s';
const cap=s=>s[0].toUpperCase()+s.slice(1);
const SUBJ=[['He','s'],['She','s'],['They','p'],['We','p'],['The manager','s'],['The engineers','p'],['My friend','s'],['Our teachers','p'],['The company','s'],['The students','p'],['Ravi','s'],['Meera and Karan','p']];
const be=(n,pl)=>pl==='s'?n[0]:n[1];
/* verbs: [v1, v1s, v2, v3, ving] */
const V=[['work','works','worked','worked','working'],['live','lives','lived','lived','living'],['study','studies','studied','studied','studying'],['wait','waits','waited','waited','waiting'],['teach','teaches','taught','taught','teaching'],['play','plays','played','played','playing'],['train','trains','trained','trained','training'],['stay','stays','stayed','stayed','staying'],['write','writes','wrote','written','writing'],['drive','drives','drove','driven','driving'],['speak','speaks','spoke','spoken','speaking'],['sing','sings','sang','sung','singing'],['know','knows','knew','known','knowing'],['see','sees','saw','seen','seeing']];

const norm=s=>{s=String(s).toLowerCase();s=s.replace(/₹/g,' rs ').replace(/\brs\.?\s*(?=\d)/g,' rs ').replace(/%/g,' percent ').replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/[‐-―-]/g,' ').replace(/[^a-z0-9:.\s]/g,' ').replace(/\.(?=\s|$)/g,' ');return ' '+s.replace(/\s+/g,' ').trim()+' '};
const hasFact=(text,alts)=>{const t=norm(text);return alts.some(a=>{const n=norm(a);if(!n.trim())return false;if(/^[a-z ]+$/.test(n.trim()))return t.includes(n.replace(/ $/,''));return t.includes(n)})};
const numsIn=s=>(norm(s).match(/\b\d[\d.:]*\d\b|\b\d\b/g)||[]);
const scoreRecall=(task,text)=>{const found=[],missing=[];task.facts.forEach(f=>(hasFact(text,f)?found:missing).push(f[0]));const allowed=new Set(numsIn(task.p));task.facts.forEach(f=>f.forEach(a=>numsIn(a).forEach(n=>allowed.add(n))));const wrong=[...new Set(numsIn(text).filter(n=>!allowed.has(n)))];return {found,missing,wrong,pct:Math.round(100*found.length/task.facts.length)}};
const NW={1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',11:'eleven',12:'twelve'};
const scoreEmail=(em,text)=>{const words=text.trim()?text.trim().split(/\s+/).length:0,t=text;const facts=em.facts.map(f=>({f,ok:hasFact(t,/^\d{1,2}$/.test(f)&&NW[+f]?[f,NW[+f]]:[f])}));const fp=facts.length?facts.filter(x=>x.ok).length/facts.length:1;
  const chk=[['Subject line',/subject\s*:/i.test(t)||/^.{4,90}\n\s*\n\s*(dear|hello|hi)\b/i.test(t.trim())],['Formal greeting (Dear …)',/\bdear\s+\w+/i.test(t)],['Purpose stated (I am writing …)',/(i am writing|i write|i would like to|i wish to|this is to|i am pleased|i regret|i apologi[sz]e|i request|please find|following up|thank you for|this is a gentle reminder)/i.test(t)],['Polite request or next step',/(please|kindly|would be grateful|i would appreciate|could you|let me know|look forward)/i.test(t)],['Polite closing',/(thank you|thanks|regards|sincerely|faithfully|yours)/i.test(t)],['Sender name at the end',(()=>{const ls=t.trim().split('\n').filter(x=>x.trim());const l=ls[ls.length-1]||'';return ls.length>3&&l.trim().split(/\s+/).length<=4&&!/[.!?]$/.test(l.trim())})()],['Length 60 to 200 words',words>=60&&words<=200],['Formal tone (no slang)',!/\b(hey|gonna|wanna|asap|u r|pls|plz|lol|bro|dude)\b/i.test(t)]];
  return {facts,chk,words,pct:Math.min(100,Math.round(fp*40+chk.reduce((a,c)=>a+(c[1]?7.5:0),0)))}};
/* stats */
const stats=()=>LS.get('stats',{topics:{},exams:[],att:0,cor:0,rec:[],em:[]});
const addStat=(topic,ok)=>{const s=stats();const t=s.topics[topic]=s.topics[topic]||{a:0,c:0};t.a++;if(ok)t.c++;s.att++;if(ok)s.cor++;LS.set('stats',s)};

const pickBank=(k,n)=>{const pool=BK[k]||[];let s=seen(k);let un=pool.filter(q=>!s.includes(q.id));if(un.length<n){s=[];un=pool.slice()}const ch=shuffle(un).slice(0,n);LS.set('seen_'+k,s.concat(ch.map(q=>q.id)));return ch};
function shell(tab,inner){app.innerHTML=`<div class="top"><span class="brand">TCS NQT · Verbal Ability Practice</span><div class="tabs">${[['exam','Exam Mode'],['sc','Sentence Completion'],['pr','Passage Recall'],['em','Email Writing'],['bank','Bank'],['prog','My Progress']].map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div></div><div class="wrap" id="body">${inner}</div>`;

const bar=(id,color)=>`<div class="pbar"><i id="${id||'pb'}" style="${color?'background:'+color:''}"></i></div>`;
const runClock=(secs,onEnd)=>{clearInterval(timer);const end=Date.now()+secs*1000/SPEED;const f=()=>{const left=(end-Date.now())/1000*SPEED;const t=$('#timer');if(t){t.textContent=fmt(left)}const pb=$('#pb');if(pb)pb.style.width=Math.max(0,100*left/secs)+'%';if(left<=0){clearInterval(timer);onEnd()}};f();timer=setInterval(f,200)};

function exShell(inner,foot){app.innerHTML=`<div id="shell2"><div class="top"><span class="brand">Verbal Ability · Exam Mode</span><span style="margin-left:auto"></span><div id="timer">0:25</div></div><div id="qarea" style="flex:1;overflow:auto;padding:18px 26px;background:#fff">${inner}</div><div id="foot">${foot||'<span class="sp"></span>'}</div></div>`}
function exStep(){const e=EX;clearInterval(timer);
  if(e.phase==='sc'){const it=e.sc[e.idx];exShell(`<div><span class="qno">Sentence completion ${e.idx+1} of 20</span><span class="qtopic">25 seconds per item</span></div>${bar()}<div class="qtext">${it.q.q}</div>${it.ord.map((oi,k)=>`<div class="opt ${e.scAns[e.idx]===oi?'sel':''}" data-o="${oi}"><span class="k">${L[k]}.</span><span>${it.q.o[oi]}</span></div>`).join('')}`,'<span class="sp"></span><button class="btn" id="nx">Next »</button>');

    else{exShell(`<div><span class="qno">Passage recall ${e.idx+1} of 4: WRITE</span><span class="qtopic">90 seconds</span></div>${bar('pb','#f59e0b')}<p class="mut sm">The passage is hidden. Type everything you remember.</p><textarea class="big" id="ta" spellcheck="false" placeholder="Type here..."></textarea><div class="sm mut" id="wc">0 words</div>`,'<span class="sp"></span><button class="btn" id="nx">Submit &amp; Next »</button>');
      const ta=$('#ta');['paste','copy','cut','drop','contextmenu'].forEach(ev=>ta.addEventListener(ev,x=>x.preventDefault()));ta.oninput=()=>{$('#wc').textContent=(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+' words'};setTimeout(()=>ta.focus(),50);
      const nx=()=>{clearInterval(timer);e.prAns[e.idx]=ta.value;e.idx++;if(e.idx>=4){e.phase='ins2';e.idx=0}else e.sub='read';exStep()};$('#nx').onclick=nx;runClock(90,nx)}}
  else if(e.phase==='ins2'){exShell(`<div class="card"><span class="tag">INSTRUCTION SCREEN</span><h2>Email Writing: how it works</h2><p>You will get a short work situation. Write a complete, polite email in <b>9 minutes</b>: subject line, greeting, purpose in the first sentence, the facts given, a clear request or next step, a closing and your name.</p></div>${bar()}`,'<span class="sp"></span><button class="btn" id="nx">Continue »</button>');const nx=()=>{clearInterval(timer);e.phase='em';exStep()};$('#nx').onclick=nx;runClock(15,nx)}
  else{exShell(`<div><span class="qno">Email writing</span><span class="qtopic">9 minutes</span></div>${bar('pb','#7c3aed')}<div class="qtext">${esc(e.em.sc)}</div><textarea class="big" id="ta" style="min-height:300px" spellcheck="false" placeholder="Subject: ...&#10;&#10;Dear ...,"></textarea><div class="sm mut" id="wc">0 words</div>`,'<span class="sp"></span><button class="btn rd" id="nx">Submit email &amp; finish</button>');
    const ta=$('#ta');['paste','drop'].forEach(ev=>ta.addEventListener(ev,x=>x.preventDefault()));ta.oninput=()=>{e.emAns=ta.value;$('#wc').textContent=(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+' words'};const nx=()=>{clearInterval(timer);e.emAns=ta.value;exFinish()};$('#nx').onclick=nx;runClock(540,nx)}}
function exFinish(){const e=EX;let sc_=0;e.sc.forEach((it,k)=>{const ok=e.scAns[k]===it.q.a;if(ok)sc_++;addStat('SC: '+it.q.t,ok)});

  const overall=Math.round(100*(sc_+prs.reduce((a,x)=>a+x.s.pct/100,0)+es.pct/100)/25);
  const s=stats();s.exams.push({d:Date.now(),p:overall,sc:sc_,pr:prAvg,em:es.pct});s.exams=s.exams.slice(-30);LS.set('stats',s);scormReport(overall,`VERBAL:${overall}%,SC:${sc_}/20,REC:${prAvg}%,EMAIL:${es.pct}%`);
  shell('exam',`<div class="card"><span class="tag">TEST COMPLETED</span><h1>Verbal score: ${overall}%</h1><table class="t"><tr><th>Part</th><th>Result</th></tr><tr><td>Sentence completion</td><td>${sc_} / 20</td></tr><tr><td>Passage recall (4 tasks)</td><td>${prAvg}% of key facts</td></tr><tr><td>Email writing</td><td>${es.pct}%</td></tr></table><p style="margin-top:10px"><button class="btn gr" id="again">Take a new test</button></p><p class="sm mut">Overall = (sentence completion marks + recall % + email %) out of 25 items. Recall and email scores are practice indicators from key-fact and checklist matching, not official marking.</p></div>

/* ============ shared result renderers ============ */
function recallResult(p,text,s,title){return `<h3>${title}: ${s.pct}% of key facts</h3><div>${s.found.map(f=>`<span class="tc p">✓ ${esc(f)}</span>`).join('')}${s.missing.map(f=>`<span class="tc f">✗ ${esc(f)}</span>`).join('')}</div>${s.wrong.length?`<p class="bad sm">Numbers not in the passage (possible mistakes): ${esc(s.wrong.join(', '))}</p>`:'<p class="ok sm">No invented numbers.</p>'}<details><summary class="sm">Passage, model recall and your answer</summary><p class="sm"><b>Passage:</b> ${esc(p.p)}</p><p class="sm"><b>Model recall:</b> ${esc(p.m)}</p><p class="sm"><b>You wrote:</b> ${esc(text)||'(blank)'}</p></details>`}
function emailResult(em,text,s){return `<h3>${esc(em.title)}: ${s.pct}% (${s.words} words)</h3><div>${s.chk.map(c=>`<span class="tc ${c[1]?'p':'f'}">${c[1]?'✓':'✗'} ${esc(c[0])}</span>`).join('')}</div><p class="sm">Facts from the situation: ${s.facts.map(f=>`<span class="tc ${f.ok?'p':'f'}">${esc(f.f)}</span>`).join('')}</p><details><summary class="sm">Situation, your email and the model email</summary><p class="sm"><b>Situation:</b> ${esc(em.sc)}</p><pre class="samp">${esc(text)||'(blank)'}</pre><pre class="samp">${esc(em.model)}</pre></details>`}
/* ============ SC practice engine ============ */
function scEngine(getQ,limit){let cur=null,t0,tm,answered,sel,sess={a:0,c:0,streak:0,best:0};
  const upd=()=>{const e=$('#sst');if(e)e.innerHTML=`Attempted <b>${sess.a}</b> · Correct <b>${sess.c}</b> · Accuracy <b>${sess.a?Math.round(100*sess.c/sess.a):0}%</b> · Streak <b>${sess.streak}</b> (best ${sess.best})`};
  const draw=()=>{cur=getQ();answered=false;sel=null;t0=Date.now();if(!cur){$('#pq').innerHTML='<p>No more questions.</p>';return}
    const ord=shuffle(cur.o.map((_,i)=>i));cur._ord=ord;$('#pq').innerHTML=`<div><span class="qno">Question ${sess.a+1}</span><span class="qtopic">${esc(cur.t)}</span></div><div class="qtext">${cur.q}</div>${ord.map((oi,k)=>`<div class="opt" data-o="${oi}"><span class="k">${L[k]}.</span><span>${cur.o[oi]}</span></div>`).join('')}<div id="fb"></div><div style="margin-top:12px"><button class="btn" id="chk">Check answer</button> <button class="btn sec" id="skip">Skip</button> <span class="mut sm" id="tmr"></span></div>`;
    $$('.opt').forEach(d=>d.onclick=()=>{if(answered)return;sel=+d.dataset.o;$$('.opt').forEach(x=>x.classList.toggle('sel',x===d))});$('#chk').onclick=()=>check();$('#skip').onclick=()=>{if(!answered){rec(false)}draw()};
    clearInterval(tm);if(limit){tm=setInterval(()=>{const left=limit-(Date.now()-t0)/1000*SPEED;const e=$('#tmr');if(e)e.textContent='Time left: '+Math.max(0,Math.round(left))+' s';if(left<=0&&!answered){clearInterval(tm);check(true)}},300)}};
  const rec=ok=>{sess.a++;if(ok){sess.c++;sess.streak++;sess.best=Math.max(sess.best,sess.streak)}else sess.streak=0;addStat('SC: '+cur.t,ok);upd()};
  const check=timeout=>{if(answered||!cur)return;if(sel===null&&!timeout){$('#fb').innerHTML='<p class="bad">Choose an option first, or press Skip.</p>';return}answered=true;clearInterval(tm);const ok=sel===cur.a;rec(ok);
    $$('.opt').forEach(d=>{const k=+d.dataset.o;if(k===cur.a)d.classList.add('right');else if(k===sel)d.classList.add('wrong')});$('#fb').innerHTML=`<div class="fb ${ok?'g':'r'}"><b>${ok?'Correct!':timeout&&sel===null?'Time is up.':'Not quite.'}</b> Correct answer: <b>${cur.o[cur.a]}</b><br><span class="sm">${cur.e||''}</span></div>`;$('#chk').textContent='Next question »';$('#chk').onclick=()=>draw();$('#skip').style.display='none'};
  document.onkeydown=e=>{if(!cur||e.target.tagName==='SELECT')return;if(e.key==='Enter'){answered?draw():check()}else if(/^[1-4]$/.test(e.key)&&!answered){const d=$$('.opt')[+e.key-1];if(d){sel=+d.dataset.o;$$('.opt').forEach(x=>x.classList.toggle('sel',x===d))}}};
  upd();draw()}

function prLoop(rt,wt,getP,back){const p=getP();const sess=prLoop.s=prLoop.s||{n:0,sum:0};
  const read=()=>{$('#body').innerHTML=`<div class="card"><div class="row2"><span class="tag">READ</span><span class="mut sm">Passage ${sess.n+1} · disappears in ${rt} s</span><span id="tm" class="tmr">${rt}</span></div>${bar('pb')}<p class="qtext" style="user-select:none;line-height:1.8">${esc(p.p)}</p></div>`;runClockMs(rt,'tm',write)};
  const write=()=>{$('#body').innerHTML=`<div class="card"><div class="row2"><span class="tag" style="background:#f59e0b">WRITE</span><span class="mut sm">Passage hidden. Type what you remember.</span><span id="tm" class="tmr">${wt}</span></div>${bar('pb','#f59e0b')}<textarea class="big" id="ta" spellcheck="false" placeholder="Type here..."></textarea><div class="sm mut" id="wc">0 words</div><button class="btn" id="sub" style="margin-top:8px">Submit</button></div>`;const ta=$('#ta');['paste','copy','cut','drop','contextmenu'].forEach(ev=>ta.addEventListener(ev,x=>x.preventDefault()));ta.oninput=()=>{$('#wc').textContent=(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+' words'};ta.focus();let done=false;const fin=()=>{if(done)return;done=true;clearInterval(timer);result(ta.value)};$('#sub').onclick=fin;runClockMs(wt,'tm',fin)};
  const result=text=>{const s=scoreRecall(p,text);sess.n++;sess.sum+=s.pct;const st=stats();st.rec=(st.rec||[]).concat([s.pct]).slice(-100);LS.set('stats',st);
    $('#body').innerHTML=`<div class="card"><span class="tag">RESULT</span><div class="big">${s.pct}%</div><p class="mut">Session average: <b>${Math.round(sess.sum/sess.n)}%</b> over ${sess.n} passage(s)</p>${recallResult(p,text,s,esc(p.title||'Passage'))}<p style="margin-top:10px"><button class="btn gr" id="nx">Next passage</button> <button class="btn sec" id="bk">Change settings</button></p></div>`;$('#nx').onclick=()=>prLoop(rt,wt,getP,back);$('#bk').onclick=()=>{prLoop.s=null;back()}};
  read()}
const runClockMs=(secs,elId,onEnd)=>{clearInterval(timer);const end=Date.now()+secs*1000/SPEED;const f=()=>{const left=(end-Date.now())/1000*SPEED;const t=$('#'+elId);if(t)t.textContent=Math.max(0,Math.ceil(left));const pb=$('#pb');if(pb)pb.style.width=Math.max(0,100*left/secs)+'%';if(left<=0){clearInterval(timer);onEnd()}};f();timer=setInterval(f,200)};
/* ============ EMAIL (unlimited / bank) ============ */
function emHome(){shell('em',`<div class="card"><span class="tag">UNLIMITED PRACTICE</span><h1>Email writing</h1><p class="mut">A new work situation every time (leave, complaint, follow-up, request, apology, application, reminder, thanks). Write the email, then see your checklist score and a model email.</p>
  <div class="grid2"><div><label>Time limit</label><select id="e_t"><option value="540" selected>9 minutes (exam)</option><option value="0">No timer</option><option value="360">6 minutes (harder)</option></select></div><div></div></div><p><button class="btn gr" id="go">Start</button></p></div>`);
  $('#go').onclick=()=>emLoop(+$('#e_t').value,()=>SG.email(),emHome)}
function emLoop(limit,getE,back){const em=getE();$('#body').innerHTML=`<div class="card"><div class="row2"><span class="tag">EMAIL</span><span class="mut sm">${limit?'Time limit '+limit/60+' min':'No time limit'}</span><span id="tm" class="tmr">${limit?fmt(limit):'∞'}</span></div>${limit?bar('pb','#7c3aed'):''}<div class="qtext">${esc(em.sc)}</div><textarea class="big" id="ta" style="min-height:300px" spellcheck="false" placeholder="Subject: ...&#10;&#10;Dear ...,"></textarea><div class="sm mut" id="wc">0 words</div><button class="btn" id="sub" style="margin-top:8px">Submit email</button></div>`;
  const ta=$('#ta');['paste','drop'].forEach(ev=>ta.addEventListener(ev,x=>x.preventDefault()));ta.oninput=()=>{$('#wc').textContent=(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+' words'};ta.focus();let done=false;
  const fin=()=>{if(done)return;done=true;clearInterval(timer);const s=scoreEmail(em,ta.value);const st=stats();st.em=(st.em||[]).concat([s.pct]).slice(-100);LS.set('stats',st);
    $('#body').innerHTML=`<div class="card"><span class="tag">RESULT</span><div class="big">${s.pct}%</div>${emailResult(em,ta.value,s)}<p class="sm mut">Practice score from checklist and fact matching, not official marking.</p><p><button class="btn gr" id="nx">Next situation</button> <button class="btn sec" id="bk">Change settings</button></p></div>`;$('#nx').onclick=()=>emLoop(limit,getE,back);$('#bk').onclick=back};
  $('#sub').onclick=fin;if(limit)runClockMs2(limit,fin)}
const runClockMs2=(secs,onEnd)=>{clearInterval(timer);const end=Date.now()+secs*1000/SPEED;const f=()=>{const left=(end-Date.now())/1000*SPEED;const t=$('#tm');if(t)t.textContent=fmt(left);const pb=$('#pb');if(pb)pb.style.width=Math.max(0,100*left/secs)+'%';if(left<=0){clearInterval(timer);onEnd()}};f();timer=setInterval(f,200)};
/* ============ BANK ============ */
function bankHome(){shell('bank',`<div class="card"><span class="tag">BANK</span><h1>Hand-written exam-style bank</h1><p class="mut">${BK.sc.length} sentence-completion items, ${BK.pr.length} passages and ${BK.em.length} email tasks. Unseen items come first.</p>
  <p><button class="btn gr" id="b1">Sentence completion bank (${BK.sc.length})</button> <button class="btn gr" id="b2">Passage bank (${BK.pr.length})</button> <button class="btn gr" id="b3">Email bank (${BK.em.length})</button></p><p class="sm mut"><button class="btn sm sec" id="rs">Reset seen lists</button></p></div>`);
  $('#rs').onclick=()=>{['sc','pr','em'].forEach(k=>LS.set('seen_'+k,[]));bankHome()};
  $('#b1').onclick=()=>{$('#body').innerHTML=`<div class="card" style="padding:10px 16px"><div class="sm" id="sst"></div><button class="btn sm sec" id="chg" style="margin-top:6px">Back</button></div><div class="card" id="pq"></div>`;$('#chg').onclick=()=>{document.onkeydown=null;bankHome()};scEngine(()=>{const r=pickBank('sc',1)[0];return r?Object.assign({},r):null},25)};
  $('#b2').onclick=()=>prLoop(30,90,()=>pickBank('pr',1)[0],bankHome);$('#b3').onclick=()=>emLoop(540,()=>pickBank('em',1)[0],bankHome)}
/* ============ PROGRESS ============ */
function progress(){const s=stats();const rows=Object.entries(s.topics).map(([t,v])=>[t,v.a,v.c,Math.round(100*v.c/v.a)]).sort((a,b)=>a[3]-b[3]);const avg=a=>a&&a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  shell('prog',`<div class="card"><span class="tag">MY PROGRESS</span><h1>Your verbal practice</h1><p>Sentence-completion attempted: <b>${s.att}</b> · Correct: <b>${s.cor}</b> · Accuracy: <b>${s.att?Math.round(100*s.cor/s.att):0}%</b> · Passages recalled: <b>${(s.rec||[]).length}</b> (average ${avg(s.rec)}%) · Emails written: <b>${(s.em||[]).length}</b> (average ${avg(s.em)}%) · Full tests: <b>${s.exams.length}</b></p>
  ${rows.length?`<table class="t"><tr><th>Topic</th><th>Attempted</th><th>Correct</th><th>Accuracy</th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${r[3]>=70?'ok':r[3]<50?'bad':''}">${r[3]}%</td></tr>`).join('')}</table>`:'<p class="mut">Nothing yet.</p>'}
  <p><button class="btn sm sec" id="clr">Clear my progress</button></p><p class="sm mut">Saved in this browser only.</p></div>`);$('#clr').onclick=()=>{if(confirm('Delete all saved progress?')){LS.set('stats',{topics:{},exams:[],att:0,cor:0,rec:[],em:[]});progress()}}}
window.VP={start:()=>{scormInit();examHome()}};
})();
</script>
<script>VP.start();</script></body></html>
